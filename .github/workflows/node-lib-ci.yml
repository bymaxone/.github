# Reusable CI for Bymax single-package Node libraries (@bymax-one/nest-*).
#
# Event-driven only — the caller triggers it on push/pull_request/workflow_dispatch.
# There is NO cron here. Mutation is the deepest gate and runs ONLY on a push to the
# default branch (or manual dispatch), and only when source changed, with its
# incremental state cached. No web/e2e/export-audit (that's node-ci for example apps).
name: node-lib-ci

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version.
        type: string
        default: '24'
      library-repo:
        description: 'Sibling file: library to build (usually empty for libraries).'
        type: string
        default: ''
      run-format-check:
        description: Run `pnpm format:check`.
        type: boolean
        default: true
      unit-command:
        description: Command that runs the gated unit tests + coverage.
        type: string
        default: pnpm test:cov
      build-command:
        description: Command that builds the library.
        type: string
        default: pnpm build
      run-build:
        description: Run the build job.
        type: boolean
        default: true
      database-url:
        description: DATABASE_URL env for libs touching a Prisma client (empty to skip).
        type: string
        default: ''
      post-install:
        description: Command run right after install in every job (e.g. prisma generate).
        type: string
        default: ''
      run-mutation:
        description: Run Stryker mutation on default-branch push / manual dispatch.
        type: boolean
        default: false
      mutation-source-globs:
        description: Extended-regex of source paths whose change triggers mutation.
        type: string
        default: '^(src/)'
      mutation-timeout-minutes:
        description: >-
          Wall-clock ceiling for the mutation job. A cold run — no incremental cache, or a
          library that keeps `ignoreStatic: false` so every static mutant re-runs the whole
          suite — can take far longer than a warm one, and the job is cancelled rather than
          failed when it lands, which reads as an infrastructure blip instead of a budget.
          Raise it per-library rather than globally.
        type: number
        default: 45

concurrency:
  group: node-lib-ci-${{ github.workflow }}-${{ github.ref }}
  # Superseding is right on a branch and wrong on the default one. On a pull request a newer
  # push makes the older run irrelevant, so cancelling saves runner time and nothing else.
  # On the default branch every push is a distinct commit whose gate result is the record for
  # that commit — and the mutation job runs ONLY there, and takes over an hour when cold. With
  # blanket cancellation the deepest gate is the one most likely to be killed: any merge inside
  # its window ends it, and it never produces the verdict or the incremental baseline it exists
  # to produce. That is not hypothetical — it is what happened to nest-auth#77.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

env:
  DATABASE_URL: ${{ inputs.database-url }}

jobs:
  # Two checks that need no toolchain and belong to the tree rather than to the
  # language, so they are identical in every reusable and run without `needs`.
  #
  # actionlint validates the workflows themselves. A workflow file carrying an
  # invalid expression is rejected by Actions wholesale: no jobs start, no logs
  # are produced, and the run reports only "This run likely failed because of a
  # workflow file issue". A YAML parser does not see it, because the file is
  # valid YAML -- the expression is what is malformed. That failure is invisible
  # without a check, which is what makes a red check proportionate here.
  #
  # SC2016 is excluded because a single-quoted `$` in an awk or sed program is
  # deliberate throughout these workflows, and the finding is advice about shell
  # interpolation that does not apply to a program passed to another interpreter.
  #
  # actionlint is fetched in a `run:` step rather than referenced with `uses:`.
  # This organisation restricts Actions to an allow-list, and a reference outside
  # it -- a `docker://` image included, by digest or by tag -- makes Actions
  # reject the whole file at startup: startup_failure, no jobs, no annotations,
  # no logs, nothing to re-run. A downloaded release verified by checksum also
  # pins the artefact itself, which is stronger than a tag or an allow-list entry.
  hygiene:
    name: Workflow and tree hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The authorship check walks the commits this change introduces. On a
          # pull_request the checkout is the merge ref, and at the default depth
          # of 1 its parents are absent -- the range would resolve to nothing and
          # the check would report a pass over zero commits.
          fetch-depth: 0

      - name: Lint the workflow files
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -fsSL -o actionlint.tar.gz "${base}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color -shellcheck="shellcheck -e SC2016"
          rm -f actionlint actionlint.tar.gz

      # Authorship is mechanically decidable, so it is checked rather than
      # reviewed. The shared block asks a reviewer to read the field before
      # reporting it; that guard works, but it is spent on findings that are
      # usually wrong -- seven fabricated commit SHAs across three repositories
      # in one day, each quoting a `git log` that was never run. A check settles
      # every one of those before a person reads it, and unlike prose it also
      # catches a real violation.
      #
      # Scoped to the commits a pull request introduces, never to history: an
      # old commit is not something this author can act on, and asking for
      # history to be rewritten is the expensive mistake the block warns about.
      - name: No AI identity in the commits this change introduces
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --quiet --depth=50 origin "$BASE_REF"
          range="origin/${BASE_REF}..HEAD"

          # Identity fields come from the contributor's git configuration, and
          # the trailer comes from the commit body; both are checked, because a
          # change introduces either one the same way.
          #
          # POSIX ERE rather than -P: perl regex is a GNU extension, so a -P
          # pattern cannot be exercised on a BSD grep before it ships here.
          # The word boundaries are spelled out so "Claudia" is not "Claude".
          identities='(^|[^a-zA-Z])(codex|claude|copilot|chatgpt)([^a-zA-Z]|$)|@(anthropic|openai)\.com'
          trailer='co-authored-by:.*(claude|codex|copilot|anthropic|openai)'

          # `grep` exits 1 for "no match" and 2 for a real error, and `|| true`
          # collapses both into success -- which would turn a broken check into a
          # silent pass. Each status is handled on its own.
          match() {
            local out rc
            out=$(printf '%s\n' "$2" | grep -iE "$1") && rc=0 || rc=$?
            case "$rc" in
              0) printf '%s' "$out" ;;
              1) ;;
              *) echo "::error title=authorship::grep failed with status $rc; refusing to report a pass." >&2
                 exit 3 ;;
            esac
          }
          offenders=$(match "$identities" "$(git log "$range" --format='%H %an <%ae> / %cn <%ce>')")
          trailers=$(match "$trailer" "$(git log "$range" --format='%H%n%B')")

          if [ -n "$offenders" ] || [ -n "$trailers" ]; then
            echo "::error title=authorship::a commit in this change attributes authorship to an AI tool. Amend the identity or drop the trailer; the organisation rule is that no commit, pull request or comment does this."
            [ -n "$offenders" ] && printf 'author/committer:\n%s\n' "$offenders"
            [ -n "$trailers" ] && printf 'trailer:\n%s\n' "$trailers"
            exit 1
          fi
          # A pull request always introduces at least one commit. An empty range
          # means the history is not traversable, not that the change is clean --
          # reporting a pass there is the failure this check exists to prevent.
          count=$(git rev-list --count "$range")
          if [ "$count" -eq 0 ]; then
            echo "::error title=authorship::the range $range resolved to no commits, so nothing was checked. This is a checkout-depth problem, not a clean result."
            exit 1
          fi
          echo "no AI identity in $count commit(s)"

      # A directory exists when there is a real file to put in it. This was a
      # review rule until a check could decide it; a grep decides it, so it lives
      # here and the shared block no longer carries the section.
      - name: Refuse empty-directory placeholders
        run: |
          set -euo pipefail
          found=$(git ls-files | grep -E '(^|/)\.(git)?keep$' || true)
          if [ -n "$found" ]; then
            echo "::error title=hygiene::placeholder files for empty directories do not belong in the tree; a directory exists when there is a real file to put in it."
            printf '%s\n' "$found"
            exit 1
          fi

  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ inputs.node-version }}
          library-repo: ${{ inputs.library-repo }}
          post-install: ${{ inputs.post-install }}

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ inputs.node-version }}
          library-repo: ${{ inputs.library-repo }}
          post-install: ${{ inputs.post-install }}
      - run: pnpm lint

  typecheck:
    name: Type-check
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ inputs.node-version }}
          library-repo: ${{ inputs.library-repo }}
          post-install: ${{ inputs.post-install }}
      - run: pnpm typecheck

  format:
    name: Format check
    needs: install
    if: inputs.run-format-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ inputs.node-version }}
          library-repo: ${{ inputs.library-repo }}
          post-install: ${{ inputs.post-install }}
      - run: pnpm format:check

  unit:
    name: Unit tests + coverage
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ inputs.node-version }}
          library-repo: ${{ inputs.library-repo }}
          post-install: ${{ inputs.post-install }}
      - name: Unit tests + coverage
        run: ${{ inputs.unit-command }}
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-unit
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build
    needs: install
    if: inputs.run-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ inputs.node-version }}
          library-repo: ${{ inputs.library-repo }}
          post-install: ${{ inputs.post-install }}
      - run: ${{ inputs.build-command }}

  mutation:
    name: Mutation testing
    # The deepest gate. Never on PRs, never on a schedule — only on a push to the
    # default branch or a manual dispatch, and only when source changed.
    needs: [unit]
    if: >-
      inputs.run-mutation &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.mutation-timeout-minutes }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Detect source changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "Manual dispatch — running mutation."; exit 0
          fi
          base="${{ github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="${{ github.sha }}^"
          fi
          if git diff --name-only "$base" "${{ github.sha }}" | grep -qE '${{ inputs.mutation-source-globs }}'; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "Source changed — running mutation."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "No source changes — skipping mutation."
          fi
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: ${{ inputs.node-version }}
          library-repo: ${{ inputs.library-repo }}
          post-install: ${{ inputs.post-install }}
      - name: Restore Stryker incremental cache
        if: steps.changes.outputs.run == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}
          restore-keys: |
            stryker-incremental-
      - name: Run Stryker mutation
        if: steps.changes.outputs.run == 'true'
        run: pnpm mutation
      - name: Upload mutation reports
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-reports
          path: reports/mutation/
          retention-days: 7
          if-no-files-found: ignore
