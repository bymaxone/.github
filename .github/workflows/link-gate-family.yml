# Measures the link check of every library's published-surface gate against a matrix of cases: a third
# party's 5xx, or a 429 that survives the retry, must be a note and not a failure, while a 404, a 410, a
# 403, a 401, plain http, a private address and a broken anchor must still fail.
#
# Each library carries its own copy of that check, so nothing here can update a copy; this reads them. For
# each repository in .github/link-gate-libraries.txt it resolves the default branch to a commit, reads the
# library's link check at that commit and runs the cases of .github/scripts/link-gate/matrix.mjs on it, with
# the network and DNS stubbed. A copy that decides a case differently, or whose link check cannot be found,
# is red and named. The verdicts are the script's own behaviour, so a branch that is dead in a copy cannot
# pass by being present.
#
# It executes code read from other repositories, which nobody reviewed here. So the job holds
# `contents: read` and nothing else, references no secret, starts with harden-runner in audit mode, and runs
# each library's check in a child process that gets an empty environment (no token), stubbed fetch and DNS,
# a timeout, a network namespace of its own and the `nobody` user (see .github/scripts/link-gate/probe.mjs).
#
# Weekly, and on dispatch. It was dispatch-only until every library carried the patch, since scheduled
# earlier it would have been red from the first run. Not a gate on pull requests.
name: link-gate-family

on:
  schedule:
    - cron: '53 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  family:
    name: Link gate family
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner
        # Egress is audited, not blocked: the report lists every host the job reached.
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      # A dispatch can be aimed at any ref; the matrix and the list are read from the checked-out ref, so
      # only the default branch's own are the ones to measure the libraries against.
      - name: Refuse a run outside the default branch
        env:
          RUN_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '\000-\037\177' | cut -c1-200; }
          if [ "$RUN_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error title=link-gate::link-gate-family runs only on the default branch ($(clean "$DEFAULT_BRANCH")). Dispatch it there."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Run the matrix on every library's link check
        env:
          # Read by this process only, to fetch the libraries' files; the children get an empty environment.
          # The libraries are public, so the job's own token reads them and no other credential exists here.
          GH_TOKEN: ${{ github.token }}
          LINK_GATE_ISOLATE: '1'
        run: |
          set -euo pipefail
          node .github/scripts/link-gate/check-family.mjs --list .github/link-gate-libraries.txt
