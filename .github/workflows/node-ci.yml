# Reusable CI for Bymax Node projects (libraries and example apps).
#
# Event-driven only — the caller triggers it on push/pull_request/workflow_dispatch.
# There is NO cron here: tests never run on a schedule. Mutation testing is the
# deepest gate and runs ONLY on a push to the default branch (or manual dispatch),
# and only when application source changed, with its incremental state cached.
#
# Callers pass a small set of inputs to opt into web/e2e/mutation. Everything is
# convention-based on the standard Bymax pnpm scripts (lint, typecheck,
# format:check, test:cov(:api|:web), test:e2e(:api), build, audit:exports, mutation).
name: node-ci

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version.
        type: string
        default: "24"
      library-repo:
        description: owner/name of a sibling `file:` library to build (empty to skip).
        type: string
        default: ""
      has-web:
        description: Run the web build (and web coverage / Playwright e2e).
        type: boolean
        default: true
      run-format-check:
        description: Run `pnpm format:check`.
        type: boolean
        default: true
      run-unit:
        description: Run the unit test + coverage job.
        type: boolean
        default: true
      run-e2e-api:
        description: Run the API e2e suite (Testcontainers).
        type: boolean
        default: true
      unit-command:
        description: Command that runs the gated unit tests + coverage.
        type: string
        default: pnpm test:cov
      e2e-api-command:
        description: Command that runs the API e2e suite.
        type: string
        default: pnpm test:e2e:api
      database-url:
        description: DATABASE_URL env for jobs touching a Prisma client (empty to skip).
        type: string
        default: ""
      post-install:
        description: Command run right after install in every job (e.g. prisma generate).
        type: string
        default: ""
      run-e2e-web:
        description: Run the Playwright web smoke (needs has-web).
        type: boolean
        default: true
      run-export-audit:
        description: Run `pnpm audit:exports` (library export-usage contract).
        type: boolean
        default: false
      run-mutation:
        description: Run Stryker mutation on default-branch push / manual dispatch.
        type: boolean
        default: false
      mutation-source-globs:
        description: Extended-regex of source paths whose change triggers mutation.
        type: string
        default: "^(apps/api/src/|apps/web/lib/|apps/web/components/|src/)"
      redis-image:
        description: Redis image for the web e2e service.
        type: string
        default: redis:7-alpine
      api-port:
        description: Port the API listens on during the web e2e.
        type: string
        default: "3001"
      web-port:
        description: Port the web app listens on during the web e2e.
        type: string
        default: "3000"

# Cancel superseded runs for the same ref so only the latest commit is verified.
concurrency:
  group: node-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Available to every job — Prisma apps read DATABASE_URL at config-load time
# (lint/typecheck included); empty and harmless for non-Prisma repos.
env:
  DATABASE_URL: ${{ inputs.database-url }}

jobs:
  # Two checks that need no toolchain and belong to the tree rather than to the
  # language, so they are identical in every reusable and run without `needs`.
  #
  # actionlint validates the workflows themselves. A workflow file carrying an
  # invalid expression is rejected by Actions wholesale: no jobs start, no logs
  # are produced, and the run reports only "This run likely failed because of a
  # workflow file issue". A YAML parser does not see it, because the file is
  # valid YAML -- the expression is what is malformed. That failure is invisible
  # without a check, which is what makes a red check proportionate here.
  #
  # SC2016 is excluded because a single-quoted `$` in an awk or sed program is
  # deliberate throughout these workflows, and the finding is advice about shell
  # interpolation that does not apply to a program passed to another interpreter.
  hygiene:
    name: Workflow and tree hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Lint the workflow files
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        with:
          args: -color -shellcheck="shellcheck -e SC2016"

      # A directory exists when there is a real file to put in it. This was a
      # review rule until a check could decide it; a grep decides it, so it lives
      # here and the shared block no longer carries the section.
      - name: Refuse empty-directory placeholders
        run: |
          set -euo pipefail
          found=$(git ls-files | grep -E '(^|/)\.(git)?keep$' || true)
          if [ -n "$found" ]; then
            echo "::error title=hygiene::placeholder files for empty directories do not belong in the tree; a directory exists when there is a real file to put in it."
            printf '%s\n' "$found"
            exit 1
          fi

  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ inputs.node-version }}
          library-repo: ${{ inputs.library-repo }}
          post-install: ${{ inputs.post-install }}

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ inputs.node-version }}
          library-repo: ${{ inputs.library-repo }}
          post-install: ${{ inputs.post-install }}
      - run: pnpm lint

  typecheck:
    name: Type-check
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ inputs.node-version }}
          library-repo: ${{ inputs.library-repo }}
          post-install: ${{ inputs.post-install }}
      - run: pnpm typecheck

  format:
    name: Format check
    needs: install
    if: inputs.run-format-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ inputs.node-version }}
          library-repo: ${{ inputs.library-repo }}
          post-install: ${{ inputs.post-install }}
      - run: pnpm format:check

  unit:
    name: Unit tests + coverage
    needs: install
    if: inputs.run-unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ inputs.node-version }}
          library-repo: ${{ inputs.library-repo }}
          post-install: ${{ inputs.post-install }}
      # The root `test:cov` runs each package's gated coverage serialized
      # (`--workspace-concurrency=1`), so a locally linked library is never
      # duplicated across two runners at once.
      - name: Unit tests + coverage
        run: ${{ inputs.unit-command }}
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: |
            apps/*/coverage/
            coverage/
          retention-days: 7
          if-no-files-found: ignore

  e2e-api:
    name: E2E — API
    needs: install
    if: inputs.run-e2e-api
    runs-on: ubuntu-latest
    # GitHub-hosted runners ship a Docker daemon, so a Testcontainers suite boots
    # its own services directly — no `services:` block required.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ inputs.node-version }}
          library-repo: ${{ inputs.library-repo }}
          post-install: ${{ inputs.post-install }}
      - run: ${{ inputs.e2e-api-command }}

  export-usage:
    name: Export usage audit
    needs: install
    if: inputs.run-export-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ inputs.node-version }}
          library-repo: ${{ inputs.library-repo }}
          post-install: ${{ inputs.post-install }}
      - run: pnpm audit:exports

  web-build:
    name: Web production build
    needs: install
    if: inputs.has-web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_API_URL: http://localhost:${{ inputs.api-port }}
      NEXT_PUBLIC_WS_URL: http://localhost:${{ inputs.api-port }}
    steps:
      - uses: actions/checkout@v5
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ inputs.node-version }}
          library-repo: ${{ inputs.library-repo }}
          post-install: ${{ inputs.post-install }}
      - run: pnpm --filter web run build

  e2e-web:
    name: E2E — Web (Playwright)
    # Only the build is a prerequisite — decoupled from e2e-api so it still runs
    # when run-e2e-api is false.
    needs: [web-build]
    if: inputs.has-web && inputs.run-e2e-web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: ${{ inputs.redis-image }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PORT: ${{ inputs.api-port }}
      WEB_ORIGIN: http://localhost:${{ inputs.web-port }}
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      CACHE_MODE: standalone
      NEXT_PUBLIC_API_URL: http://localhost:${{ inputs.api-port }}
      NEXT_PUBLIC_WS_URL: http://localhost:${{ inputs.api-port }}
      PLAYWRIGHT_BASE_URL: http://localhost:${{ inputs.web-port }}
      PLAYWRIGHT_API_URL: http://localhost:${{ inputs.api-port }}
    steps:
      - uses: actions/checkout@v5
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ inputs.node-version }}
          library-repo: ${{ inputs.library-repo }}
          post-install: ${{ inputs.post-install }}
      - name: Build API
        run: pnpm --filter api run build
      - name: Build web
        run: pnpm --filter web run build
      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      # Boot both servers and run the smoke in ONE step: backgrounded processes are
      # torn down when a step's shell exits, so they must outlive the wait + test.
      - name: Boot the stack and run the web smoke
        run: |
          set -euo pipefail
          pnpm --filter api run start > /tmp/api.log 2>&1 &
          pnpm --filter web run start > /tmp/web.log 2>&1 &
          npx --yes wait-on -t 90000 \
            http-get://localhost:${{ inputs.api-port }}/health \
            http-get://localhost:${{ inputs.web-port }}
          pnpm --filter web run test:e2e
      - name: Dump server logs on failure
        if: failure()
        run: |
          echo '----- API -----'; cat /tmp/api.log || true
          echo '----- WEB -----'; cat /tmp/web.log || true
      - name: Upload Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  mutation:
    name: Mutation testing
    # The deepest, slowest gate. It NEVER runs on pull requests and NEVER on a
    # schedule — only on a push to the default branch or a manual dispatch, and
    # only when application source actually changed. PRs stay gated by coverage +
    # e2e above. The Stryker incremental state is cached so repeat runs are fast.
    needs: [unit]
    if: >-
      inputs.run-mutation &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the whole push range (before..sha) is available —
          # a multi-commit push must not miss source touched by an earlier commit.
          fetch-depth: 0
      - name: Detect application-source changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "Manual dispatch — running mutation."; exit 0
          fi
          base="${{ github.event.before }}"
          # First push of a branch (all-zero SHA) or a missing base → diff the last commit.
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="${{ github.sha }}^"
          fi
          if git diff --name-only "$base" "${{ github.sha }}" | grep -qE '${{ inputs.mutation-source-globs }}'; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "Application source changed — running mutation."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "No application-source changes — skipping mutation."
          fi
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: ${{ inputs.node-version }}
          library-repo: ${{ inputs.library-repo }}
          post-install: ${{ inputs.post-install }}
      - name: Restore Stryker incremental cache
        if: steps.changes.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            apps/*/reports/stryker-incremental.json
            reports/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}
          restore-keys: |
            stryker-incremental-
      - name: Run Stryker mutation
        if: steps.changes.outputs.run == 'true'
        run: pnpm mutation
      - name: Upload mutation reports
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-reports
          path: |
            apps/*/reports/mutation/
            reports/mutation/
          retention-days: 7
          if-no-files-found: ignore

  coverage-report:
    name: Coverage report
    needs: [unit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: coverage-artifacts
        continue-on-error: true
      - name: Publish combined coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-combined
          path: coverage-artifacts/
          retention-days: 30
          if-no-files-found: ignore
