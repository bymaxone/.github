# Reusable CI for Bymax Node projects (libraries and example apps).
#
# Event-driven only — the caller triggers it on push/pull_request/workflow_dispatch.
# There is NO cron here: tests never run on a schedule. Mutation testing is the
# deepest gate and runs ONLY on a push to the default branch (or manual dispatch),
# and only when application source changed, with its incremental state cached.
#
# Callers pass a small set of inputs to opt into web/e2e/mutation. Everything is
# convention-based on the standard Bymax pnpm scripts (lint, typecheck,
# format:check, test:cov(:api|:web), test:e2e(:api), build, audit:exports, mutation).
name: node-ci

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version.
        type: string
        default: "24"
      library-repo:
        description: owner/name of a sibling `file:` library to build (empty to skip).
        type: string
        default: ""
      has-web:
        description: Run the web build (and web coverage / Playwright e2e).
        type: boolean
        default: true
      run-format-check:
        description: Run `pnpm format:check`.
        type: boolean
        default: true
      run-unit:
        description: Run the unit test + coverage job.
        type: boolean
        default: true
      run-e2e-api:
        description: Run the API e2e suite (Testcontainers).
        type: boolean
        default: true
      unit-command:
        description: Command that runs the gated unit tests + coverage.
        type: string
        default: pnpm test:cov
      e2e-api-command:
        description: Command that runs the API e2e suite.
        type: string
        default: pnpm test:e2e:api
      database-url:
        description: DATABASE_URL env for jobs touching a Prisma client (empty to skip).
        type: string
        default: ""
      post-install:
        description: Command run right after install in every job (e.g. prisma generate).
        type: string
        default: ""
      run-e2e-web:
        description: Run the Playwright web smoke (needs has-web).
        type: boolean
        default: true
      run-export-audit:
        description: Run `pnpm audit:exports` (library export-usage contract).
        type: boolean
        default: false
      run-mutation:
        description: Run Stryker mutation on default-branch push / manual dispatch.
        type: boolean
        default: false
      mutation-source-globs:
        description: Extended-regex of source paths whose change triggers mutation.
        type: string
        default: "^(apps/api/src/|apps/web/lib/|apps/web/components/|src/)"
      redis-image:
        description: Redis image for the web e2e service.
        type: string
        default: redis:7-alpine
      api-port:
        description: Port the API listens on during the web e2e.
        type: string
        default: "3001"
      web-port:
        description: Port the web app listens on during the web e2e.
        type: string
        default: "3000"

# Cancel superseded runs for the same ref so only the latest commit is verified.
concurrency:
  group: node-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Available to every job — Prisma apps read DATABASE_URL at config-load time
# (lint/typecheck included); empty and harmless for non-Prisma repos.
env:
  DATABASE_URL: ${{ inputs.database-url }}

jobs:
  # Two checks that need no toolchain and belong to the tree rather than to the
  # language, so they are identical in every reusable and run without `needs`.
  #
  # actionlint validates the workflows themselves. A workflow file carrying an
  # invalid expression is rejected by Actions wholesale: no jobs start, no logs
  # are produced, and the run reports only "This run likely failed because of a
  # workflow file issue". A YAML parser does not see it, because the file is
  # valid YAML -- the expression is what is malformed. That failure is invisible
  # without a check, which is what makes a red check proportionate here.
  #
  # SC2016 is excluded because a single-quoted `$` in an awk or sed program is
  # deliberate throughout these workflows, and the finding is advice about shell
  # interpolation that does not apply to a program passed to another interpreter.
  #
  # actionlint is fetched in a `run:` step rather than referenced with `uses:`.
  # This organisation restricts Actions to an allow-list, and a reference outside
  # it -- a `docker://` image included, by digest or by tag -- makes Actions
  # reject the whole file at startup: startup_failure, no jobs, no annotations,
  # no logs, nothing to re-run. A downloaded release verified by checksum also
  # pins the artefact itself, which is stronger than a tag or an allow-list entry.
  hygiene:
    name: Workflow and tree hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The authorship check walks the commits this change introduces. On a
          # pull_request the checkout is the merge ref, and at the default depth
          # of 1 its parents are absent -- the range would resolve to nothing and
          # the check would report a pass over zero commits.
          fetch-depth: 0

      - name: Lint the workflow files
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -fsSL -o actionlint.tar.gz "${base}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color -shellcheck="shellcheck -e SC2016"
          rm -f actionlint actionlint.tar.gz

      # Authorship is mechanically decidable, so it is checked rather than
      # reviewed. The shared block asks a reviewer to read the field before
      # reporting it; that guard works, but it is spent on findings that are
      # usually wrong -- seven fabricated commit SHAs across three repositories
      # in one day, each quoting a `git log` that was never run. A check settles
      # every one of those before a person reads it, and unlike prose it also
      # catches a real violation.
      #
      # Scoped to the commits a pull request introduces, never to history: an
      # old commit is not something this author can act on, and asking for
      # history to be rewritten is the expensive mistake the block warns about.
      - name: No AI identity in the commits this change introduces
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --quiet --depth=50 origin "$BASE_REF"
          range="origin/${BASE_REF}..HEAD"

          # Identity fields come from the contributor's git configuration, and
          # the trailer comes from the commit body; both are checked, because a
          # change introduces either one the same way.
          #
          # POSIX ERE rather than -P: perl regex is a GNU extension, so a -P
          # pattern cannot be exercised on a BSD grep before it ships here.
          # The word boundaries are spelled out so "Claudia" is not "Claude".
          identities='(^|[^a-zA-Z])(codex|claude|copilot|chatgpt)([^a-zA-Z]|$)|@(anthropic|openai)\.com'
          trailer='co-authored-by:.*(claude|codex|copilot|anthropic|openai)'

          # `grep` exits 1 for "no match" and 2 for a real error, and `|| true`
          # collapses both into success -- which would turn a broken check into a
          # silent pass. Each status is handled on its own.
          match() {
            local out rc
            out=$(printf '%s\n' "$2" | grep -iE "$1") && rc=0 || rc=$?
            case "$rc" in
              0) printf '%s' "$out" ;;
              1) ;;
              *) echo "::error title=authorship::grep failed with status $rc; refusing to report a pass." >&2
                 exit 3 ;;
            esac
          }
          offenders=$(match "$identities" "$(git log "$range" --format='%H %an <%ae> / %cn <%ce>')")
          trailers=$(match "$trailer" "$(git log "$range" --format='%H%n%B')")

          if [ -n "$offenders" ] || [ -n "$trailers" ]; then
            echo "::error title=authorship::a commit in this change attributes authorship to an AI tool. Amend the identity or drop the trailer; the organisation rule is that no commit, pull request or comment does this."
            [ -n "$offenders" ] && printf 'author/committer:\n%s\n' "$offenders"
            [ -n "$trailers" ] && printf 'trailer:\n%s\n' "$trailers"
            exit 1
          fi
          # A pull request always introduces at least one commit. An empty range
          # means the history is not traversable, not that the change is clean --
          # reporting a pass there is the failure this check exists to prevent.
          count=$(git rev-list --count "$range")
          if [ "$count" -eq 0 ]; then
            echo "::error title=authorship::the range $range resolved to no commits, so nothing was checked. This is a checkout-depth problem, not a clean result."
            exit 1
          fi
          echo "no AI identity in $count commit(s)"

      # A directory exists when there is a real file to put in it. This was a
      # review rule until a check could decide it; a grep decides it, so it lives
      # here and the shared block no longer carries the section.
      - name: Refuse empty-directory placeholders
        run: |
          set -euo pipefail
          found=$(git ls-files | grep -E '(^|/)\.(git)?keep$' || true)
          if [ -n "$found" ]; then
            echo "::error title=hygiene::placeholder files for empty directories do not belong in the tree; a directory exists when there is a real file to put in it."
            printf '%s\n' "$found"
            exit 1
          fi

  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ inputs.node-version }}
          library-repo: ${{ inputs.library-repo }}
          post-install: ${{ inputs.post-install }}

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ inputs.node-version }}
          library-repo: ${{ inputs.library-repo }}
          post-install: ${{ inputs.post-install }}
      - run: pnpm lint

  typecheck:
    name: Type-check
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ inputs.node-version }}
          library-repo: ${{ inputs.library-repo }}
          post-install: ${{ inputs.post-install }}
      - run: pnpm typecheck

  format:
    name: Format check
    needs: install
    if: inputs.run-format-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ inputs.node-version }}
          library-repo: ${{ inputs.library-repo }}
          post-install: ${{ inputs.post-install }}
      - run: pnpm format:check

  unit:
    name: Unit tests + coverage
    needs: install
    if: inputs.run-unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ inputs.node-version }}
          library-repo: ${{ inputs.library-repo }}
          post-install: ${{ inputs.post-install }}
      # The root `test:cov` runs each package's gated coverage serialized
      # (`--workspace-concurrency=1`), so a locally linked library is never
      # duplicated across two runners at once.
      - name: Unit tests + coverage
        run: ${{ inputs.unit-command }}
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-unit
          path: |
            apps/*/coverage/
            coverage/
          retention-days: 7
          if-no-files-found: ignore

  e2e-api:
    name: E2E — API
    needs: install
    if: inputs.run-e2e-api
    runs-on: ubuntu-latest
    # GitHub-hosted runners ship a Docker daemon, so a Testcontainers suite boots
    # its own services directly — no `services:` block required.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ inputs.node-version }}
          library-repo: ${{ inputs.library-repo }}
          post-install: ${{ inputs.post-install }}
      - run: ${{ inputs.e2e-api-command }}

  export-usage:
    name: Export usage audit
    needs: install
    if: inputs.run-export-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ inputs.node-version }}
          library-repo: ${{ inputs.library-repo }}
          post-install: ${{ inputs.post-install }}
      - run: pnpm audit:exports

  web-build:
    name: Web production build
    needs: install
    if: inputs.has-web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_API_URL: http://localhost:${{ inputs.api-port }}
      NEXT_PUBLIC_WS_URL: http://localhost:${{ inputs.api-port }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ inputs.node-version }}
          library-repo: ${{ inputs.library-repo }}
          post-install: ${{ inputs.post-install }}
      - run: pnpm --filter web run build

  e2e-web:
    name: E2E — Web (Playwright)
    # Only the build is a prerequisite — decoupled from e2e-api so it still runs
    # when run-e2e-api is false.
    needs: [web-build]
    if: inputs.has-web && inputs.run-e2e-web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: ${{ inputs.redis-image }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PORT: ${{ inputs.api-port }}
      WEB_ORIGIN: http://localhost:${{ inputs.web-port }}
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      CACHE_MODE: standalone
      NEXT_PUBLIC_API_URL: http://localhost:${{ inputs.api-port }}
      NEXT_PUBLIC_WS_URL: http://localhost:${{ inputs.api-port }}
      PLAYWRIGHT_BASE_URL: http://localhost:${{ inputs.web-port }}
      PLAYWRIGHT_API_URL: http://localhost:${{ inputs.api-port }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ inputs.node-version }}
          library-repo: ${{ inputs.library-repo }}
          post-install: ${{ inputs.post-install }}
      - name: Build API
        run: pnpm --filter api run build
      - name: Build web
        run: pnpm --filter web run build
      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      # Boot both servers and run the smoke in ONE step: backgrounded processes are
      # torn down when a step's shell exits, so they must outlive the wait + test.
      - name: Boot the stack and run the web smoke
        run: |
          set -euo pipefail
          pnpm --filter api run start > /tmp/api.log 2>&1 &
          pnpm --filter web run start > /tmp/web.log 2>&1 &
          npx --yes wait-on -t 90000 \
            http-get://localhost:${{ inputs.api-port }}/health \
            http-get://localhost:${{ inputs.web-port }}
          pnpm --filter web run test:e2e
      - name: Dump server logs on failure
        if: failure()
        run: |
          echo '----- API -----'; cat /tmp/api.log || true
          echo '----- WEB -----'; cat /tmp/web.log || true
      - name: Upload Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  mutation:
    name: Mutation testing
    # The deepest, slowest gate. It NEVER runs on pull requests and NEVER on a
    # schedule — only on a push to the default branch or a manual dispatch, and
    # only when application source actually changed. PRs stay gated by coverage +
    # e2e above. The Stryker incremental state is cached so repeat runs are fast.
    needs: [unit]
    if: >-
      inputs.run-mutation &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Full history so the whole push range (before..sha) is available —
          # a multi-commit push must not miss source touched by an earlier commit.
          fetch-depth: 0
      - name: Detect application-source changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "Manual dispatch — running mutation."; exit 0
          fi
          base="${{ github.event.before }}"
          # First push of a branch (all-zero SHA) or a missing base → diff the last commit.
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="${{ github.sha }}^"
          fi
          if git diff --name-only "$base" "${{ github.sha }}" | grep -qE '${{ inputs.mutation-source-globs }}'; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "Application source changed — running mutation."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "No application-source changes — skipping mutation."
          fi
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: ${{ inputs.node-version }}
          library-repo: ${{ inputs.library-repo }}
          post-install: ${{ inputs.post-install }}
      - name: Restore Stryker incremental cache
        if: steps.changes.outputs.run == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            apps/*/reports/stryker-incremental.json
            reports/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}
          restore-keys: |
            stryker-incremental-
      - name: Run Stryker mutation
        if: steps.changes.outputs.run == 'true'
        run: pnpm mutation
      - name: Upload mutation reports
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-reports
          path: |
            apps/*/reports/mutation/
            reports/mutation/
          retention-days: 7
          if-no-files-found: ignore

  coverage-report:
    name: Coverage report
    needs: [unit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-unit
          path: coverage-artifacts
        continue-on-error: true
      - name: Publish combined coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-combined
          path: coverage-artifacts/
          retention-days: 30
          if-no-files-found: ignore
