# Fails a pull request whose title, body or commit messages name an AI tool as their author or reviewer.
#
# A ruleset on the default branch sees only the final commit message. A squash merge builds that message from the
# pull request title and body, so a title or a body is read here, with the same patterns the rulesets carry
# (`.github/ai-attribution/patterns.json`). The
# patterns and the script that applies them are read at the commit of THIS workflow file, never from a tag, so
# the rule and the file that applies it cannot be out of step.
#
# A caller runs it on `pull_request` with the types `opened`, `edited`, `synchronize` and `reopened`: an edit of
# the title or the body must run it again. It does nothing on any other event.
name: No AI attribution

on:
  workflow_call:
    inputs:
      profile:
        description: >-
          `strict`, `narrow` or `auto`. Automatic reads the repository name: the repositories listed as narrow in
          the patterns file get the narrow profile, every other repository the strict one.
        type: string
        default: auto

permissions:
  contents: read

jobs:
  no-ai-attribution:
    name: No AI attribution
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Read the patterns and the script at this workflow's own commit
        # Every value is read from the environment and never written into the script body. An empty or malformed
        # commit stops the job instead of reading a branch's tarball.
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error title=no-ai-attribution::$1"; exit 1; }
          [ -n "$WORKFLOW_REPOSITORY" ] && printf '%s' "$WORKFLOW_SHA" | grep -Eq '^[0-9a-f]{40}$' \
            || fail "job.workflow_repository='$WORKFLOW_REPOSITORY' job.workflow_sha='$WORKFLOW_SHA' is not a repository and a commit."
          dir="$RUNNER_TEMP/ai-attribution"
          archive="$RUNNER_TEMP/ai-attribution.tar.gz"
          rm -rf "$dir" "$archive"
          mkdir -p "$dir"
          status=$(curl --silent --show-error --location --output "$archive" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$WORKFLOW_REPOSITORY/tarball/$WORKFLOW_SHA")
          [ "$status" = 200 ] || fail "Reading $WORKFLOW_REPOSITORY at $WORKFLOW_SHA answered HTTP $status."
          top=$(tar -tzf "$archive" | sed -n 1p)
          [[ "$top" =~ ^[^/]+-${WORKFLOW_SHA:0:7}/$ ]] || fail "The archive's top directory '$top' does not name commit ${WORKFLOW_SHA:0:7}."
          tar -xzf "$archive" -C "$dir" --strip-components=1 \
            "${top}.github/ai-attribution/patterns.json" "${top}.github/scripts/ai-attribution/find-attribution.mjs"
          [ -f "$dir/.github/ai-attribution/patterns.json" ] && [ -f "$dir/.github/scripts/ai-attribution/find-attribution.mjs" ] \
            || fail "The patterns or the script are missing at $WORKFLOW_SHA."
          echo "AI_ATTRIBUTION_DIR=$dir" >> "$GITHUB_ENV"

      - name: Collect the title, the body and the commit messages
        # The title and the body are text anyone who can open a pull request chooses. They go through the
        # environment into a JSON file and are never part of a command line.
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          set -euo pipefail
          items="$RUNNER_TEMP/ai-attribution-items.json"
          commits="$RUNNER_TEMP/ai-attribution-commits.json"
          gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/commits?per_page=100" \
            --jq '.[] | {where: ("commit " + .sha[0:7]), text: .commit.message}' | jq -s '.' > "$commits"
          # The endpoint lists 250 commits at most. A shorter list than the pull request's own count is a part of
          # the history, and reading a part would pass what it did not read.
          listed=$(jq 'length' "$commits")
          [[ "$PR_COMMITS" =~ ^[0-9]+$ ]] || { echo "::error title=no-ai-attribution::The pull request's commit count '$PR_COMMITS' is not a number."; exit 1; }
          if [ "$listed" -ne "$PR_COMMITS" ]; then
            echo "::error title=no-ai-attribution::This pull request has $PR_COMMITS commits and the API lists $listed, so the commit messages cannot all be read. Split the pull request."
            exit 1
          fi
          # Every line of every commit is read, a merge commit's first line included: a branch name is text a
          # person chose, and a branch named for a tool is renamed.
          jq -n --arg title "$PR_TITLE" --arg body "$PR_BODY" --slurpfile commits "$commits" \
            '[{where: "title", text: $title}, {where: "body", text: $body}] + $commits[0]' > "$items"
          echo "AI_ATTRIBUTION_ITEMS=$items" >> "$GITHUB_ENV"

      - name: Look for an AI attribution
        env:
          REPOSITORY: ${{ github.repository }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          node "$AI_ATTRIBUTION_DIR/.github/scripts/ai-attribution/find-attribution.mjs" \
            --patterns "$AI_ATTRIBUTION_DIR/.github/ai-attribution/patterns.json" \
            --repo "$REPOSITORY" --profile "$PROFILE" < "$AI_ATTRIBUTION_ITEMS"
