# Reusable dependency-security gate for Bymax repositories.
#
# Cost philosophy: the scheduled "catch a new CVE in a dependency you didn't
# touch" job is handled by Dependabot (GitHub-native, runs on GitHub infra, ~zero
# Action minutes) — see the `dependabot.yml` template. This workflow is the
# event-driven PR gate that blocks a pull request from INTRODUCING a vulnerable or
# disallowed dependency. The dependency-review job uses only GitHub-owned actions; the
# optional signatures job installs through the org's setup-node-pnpm action, which uses
# pnpm/action-setup, so it needs that action on the org's third-party-action allow-list.
name: security

on:
  workflow_call:
    inputs:
      fail-on-severity:
        description: Minimum severity that fails the check (low|moderate|high|critical).
        type: string
        default: high
      deny-licenses:
        description: Comma-separated SPDX licenses to reject (empty to allow all).
        type: string
        default: ""
      signatures:
        description: >-
          `off`, `warn` or `enforce`. Installs the lockfile and runs `npm audit signatures`, which
          checks the registry signature, and the provenance where a package publishes one, of every
          installed package. `warn` annotates a failure and stays green; `enforce` fails the check.
          It runs on whatever event the caller triggers it on.
        type: string
        default: "off"

# Read-only: requesting no write scope keeps this callable from repos whose
# default GITHUB_TOKEN is restricted (no per-repo permission grant needed). The
# result is surfaced in the check's own log/summary rather than a PR comment.
permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    # Only meaningful on a pull request — it diffs the PR's dependency changes.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: ${{ inputs.fail-on-severity }}
          deny-licenses: ${{ inputs.deny-licenses }}

  audit-signatures:
    name: Audit registry signatures
    if: inputs.signatures != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check the mode
        env:
          SIGNATURES: ${{ inputs.signatures }}
        run: |
          set -euo pipefail
          case "$SIGNATURES" in
            warn|enforce) ;;
            *) echo "::error title=security::signatures must be off, warn or enforce."; exit 1 ;;
          esac

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1

      - name: Verify the signatures and provenance of the installed packages
        env:
          SIGNATURES: ${{ inputs.signatures }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/audit-signatures.out"
          if npm audit signatures >"$out" 2>&1; then
            cat "$out"
            exit 0
          fi
          cat "$out"
          {
            echo "### npm audit signatures"
            echo
            echo '```'
            cat "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIGNATURES" = "warn" ]; then
            echo "::warning title=audit signatures::A package has an invalid or missing registry signature or attestation (warn mode; the list is in the job summary)."
            exit 0
          fi
          echo "::error title=audit signatures::A package has an invalid or missing registry signature or attestation."
          exit 1
