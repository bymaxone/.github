# Keeps the SHARED half of every repository's AGENTS.md in step with the copy in
# this repository, so the review rules that must not vary are edited once.
#
# Why this is a sync and not a reference. Codex reads AGENTS.md from the file
# tree of the repository it is reviewing — there is no org-level inheritance and
# no remote include, which is exactly how reusable workflows differ. A shared
# rule therefore has to exist as a real file in each repository, and the only
# question is whether it drifts silently or is offered as a pull request.
#
# Only the block between the `shared:begin` and `shared:end` markers is touched.
# Everything a repository writes for itself lives outside that block and is never
# read or rewritten here, because the org convention is that review configuration
# is customised per repository rather than copied wholesale.
name: agents-sync

on:
  workflow_call:
    inputs:
      agents-path:
        description: Path to the AGENTS.md whose shared block is synchronised.
        type: string
        default: AGENTS.md
      canonical-ref:
        description: >-
          Ref of bymaxone/.github to take the canonical block from. Defaults to
          the moving `v1` alias, which is what consumers already reference for
          CI; pin it only to hold a repository back deliberately.
        type: string
        default: v1
      branch:
        description: Branch the synchronisation pull request is opened from.
        type: string
        default: chore/agents-sync
      fail-on-drift:
        description: >-
          Also fail the job when the block is out of date. Off by default: the
          pull request is the signal, and a red scheduled run on the default
          branch is noise nobody can act on differently.
        type: boolean
        default: false
    secrets:
      sync-token:
        description: >-
          Token used to push the branch and open the pull request. Optional, and
          worth supplying: a pull request opened with the default GITHUB_TOKEN
          does not start workflow runs, so in a repository whose ruleset requires
          checks it cannot be merged until someone pushes to it. A token that is
          not GITHUB_TOKEN does not carry that restriction.
        required: false

permissions:
  contents: read

jobs:
  sync:
    name: agents-sync
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the consuming repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The synchronisation branch is cut from whatever is checked out here,
          # so it has to be the default branch: a `workflow_dispatch` from another
          # ref, or a same-repository pull request, would otherwise carry that
          # ref's unrelated commits into a pull request opened against the
          # default one.
          ref: ${{ github.event.repository.default_branch }}
          # The push below reuses the credential this step persists, not GH_TOKEN.
          # Without this, a supplied token authorises only the `gh` calls while
          # the push keeps GITHUB_TOKEN -- which a ruleset may exclude, and whose
          # pushes do not start workflow runs on the pull request being updated.
          token: ${{ secrets.sync-token || github.token }}

      - name: Check out the canonical rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bymaxone/.github
          ref: ${{ inputs.canonical-ref }}
          path: .agents-canonical

      - name: Splice the shared block and open a pull request when it moved
        env:
          # Inputs are read from the environment rather than interpolated into the
          # script, so a value containing shell syntax stays inert text.
          AGENTS_PATH: ${{ inputs.agents-path }}
          BRANCH: ${{ inputs.branch }}
          CANONICAL_REF: ${{ inputs.canonical-ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FAIL_ON_DRIFT: ${{ inputs.fail-on-drift }}
          GH_TOKEN: ${{ secrets.sync-token || github.token }}
        run: |
          set -euo pipefail

          canonical=.agents-canonical/agents/code-review-rules.md
          begin='<!-- shared:begin -->'
          end='<!-- shared:end -->'

          # A repository that has not adopted the shared block yet is not a
          # failure: it opted out, or it has not been wired. Say so and stop.
          if [ ! -f "$AGENTS_PATH" ]; then
            echo "::notice title=agents-sync::$AGENTS_PATH does not exist; nothing to synchronise."
            exit 0
          fi
          # Count markers with the same predicate the splice uses -- at the start
          # of a line -- so a marker mentioned inline in prose is not miscounted.
          begin_count=$(awk -v m="$begin" 'index($0, m) == 1' "$AGENTS_PATH" | wc -l | tr -d ' ')
          end_count=$(awk -v m="$end" 'index($0, m) == 1' "$AGENTS_PATH" | wc -l | tr -d ' ')

          if [ "$begin_count" -eq 0 ] && [ "$end_count" -eq 0 ]; then
            echo "::notice title=agents-sync::$AGENTS_PATH carries no shared block; nothing to synchronise."
            exit 0
          fi

          # Anything other than one pair in order is refused rather than spliced.
          # The awk below inserts at *every* begin marker and suppresses lines
          # until an end marker or EOF, so a duplicated pair copies the canonical
          # block twice and a reversed pair deletes everything after the begin
          # marker -- both of which rewrite rules that live outside the block and
          # break the guarantee that a repository's own rules are never touched.
          begin_at=$(awk -v m="$begin" 'index($0, m) == 1 { print NR; exit }' "$AGENTS_PATH")
          end_at=$(awk -v m="$end" 'index($0, m) == 1 { print NR; exit }' "$AGENTS_PATH")
          if [ "$begin_count" -ne 1 ] || [ "$end_count" -ne 1 ] || [ "$begin_at" -ge "$end_at" ]; then
            echo "::error title=agents-sync::$AGENTS_PATH has an ambiguous shared block (begin x$begin_count, end x$end_count); expected exactly one of each, begin first. Refusing to splice."
            exit 1
          fi

          # `branch` is caller-supplied and this workflow force-pushes it. Pointed
          # at the default branch it would commit straight past review; pointed at
          # an unrelated branch it would replace that branch's commits.
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "::error title=agents-sync::the branch input must not be the default branch ($DEFAULT_BRANCH); the synchronisation branch is force-pushed."
            exit 1
          fi

          # `canonical-ref` may name a release that predates the rules file, and
          # the splice below reads it with getline, which is silent when the file
          # is missing: the shared block would be replaced by nothing and the
          # deletion offered as a pull request. Checked here rather than earlier
          # so a repository that opted out still exits quietly above.
          if [ ! -s "$canonical" ]; then
            echo "::error title=agents-sync::bymaxone/.github@$CANONICAL_REF carries no agents/code-review-rules.md; refusing to splice an empty block."
            exit 1
          fi

          # Rebuild the file as: everything before the marker, the canonical block,
          # everything after. awk rather than sed, because the block is multi-line
          # and contains characters sed would treat as syntax.
          awk -v canonical="$canonical" -v b="$begin" -v e="$end" '
            index($0, b) == 1 { print_block = 1; while ((getline line < canonical) > 0) print line; close(canonical); next }
            index($0, e) == 1 { print_block = 0; next }
            print_block != 1  { print }
          ' "$AGENTS_PATH" > "$AGENTS_PATH.synced"
          mv "$AGENTS_PATH.synced" "$AGENTS_PATH"

          if git diff --quiet -- "$AGENTS_PATH"; then
            echo "✓ shared block is current with bymaxone/.github@$CANONICAL_REF"
            exit 0
          fi

          echo "::warning title=agents-sync::the shared review-rules block is out of date"
          git diff --stat -- "$AGENTS_PATH"

          subject="chore(agents): sync the shared review-rules block"

          # One read of the remote branch answers three questions: whether it
          # exists, whether this workflow is what put it there, and what value to
          # lease the push against. The checkout fetched only the default branch,
          # so without this `origin/$BRANCH` has no remote-tracking value and a
          # bare --force-with-lease is rejected as `stale info` -- on exactly the
          # path this reuses, an open synchronisation pull request.
          remote_sha=""
          if git fetch --no-tags --depth=1 origin "refs/heads/$BRANCH" 2>/dev/null; then
            remote_sha=$(git rev-parse FETCH_HEAD)
            # A lease proves nobody moved the branch between this read and the
            # push. It does not prove the branch is ours to move, so check that
            # its tip is a commit this workflow wrote before replacing it.
            if [ "$(git log -1 --format=%s FETCH_HEAD)" != "$subject" ]; then
              echo "::error title=agents-sync::$BRANCH exists and its tip is not an agents-sync commit; refusing to force-push over it."
              exit 1
            fi
          fi

          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -- "$AGENTS_PATH"
          git commit -m "$subject" -m "Taken from bymaxone/.github@${CANONICAL_REF}, agents/code-review-rules.md.
          Only the block between the shared markers is rewritten; this repository's
          own rules are outside it and untouched."

          # While a synchronisation pull request stays open the default branch
          # still carries the stale block, so every later run rebuilds the same
          # commit. Pushing it would give the pull request a new SHA with an
          # identical tree on every schedule -- rerunning checks and dismissing
          # approvals for nothing. Comparing trees rather than commits still lets
          # a genuine change through, including the default branch moving under an
          # open pull request.
          if [ -n "$remote_sha" ] \
            && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$remote_sha^{tree}")" ]; then
            echo "::notice title=agents-sync::the open synchronisation pull request already carries this tree; nothing to push."
            # The block is still out of date on the default branch, so a caller
            # that asked to fail on drift still has to see it fail.
            if [ "$FAIL_ON_DRIFT" = "true" ]; then
              exit 1
            fi
            exit 0
          fi

          # An empty expected value means the branch must not already exist, so a
          # concurrent run still loses the race rather than overwriting it.
          git push --force-with-lease="$BRANCH:$remote_sha" origin "$BRANCH"

          # Reuse the open pull request when there is one, so a weekly schedule
          # does not accumulate a queue of identical pull requests.
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')" ]; then
            gh pr create \
              --head "$BRANCH" \
              --title "$subject" \
              --body "The shared block in \`${AGENTS_PATH}\` is behind \`bymaxone/.github@${CANONICAL_REF}\`.

          Only the content between the \`shared:begin\` and \`shared:end\` markers is rewritten. Rules this repository wrote for itself live outside the block and are untouched.

          Edit the canonical copy in \`bymaxone/.github\` rather than this file — a local edit inside the block is reverted on the next run.

          _Opened by the \`agents-sync\` reusable workflow._"
          else
            echo "::notice title=agents-sync::updated the existing synchronisation pull request."
          fi

          if [ "$FAIL_ON_DRIFT" = "true" ]; then
            exit 1
          fi
