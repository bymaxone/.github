# Keeps the SHARED half of every repository's AGENTS.md in step with the copy in
# this repository, so the review rules that must not vary are edited once.
#
# Why this is a sync and not a reference. Codex reads AGENTS.md from the file
# tree of the repository it is reviewing — there is no org-level inheritance and
# no remote include, which is exactly how reusable workflows differ. A shared
# rule therefore has to exist as a real file in each repository, and the only
# question is whether it drifts silently or is offered as a pull request.
#
# Only the block between the `shared:begin` and `shared:end` markers is touched.
# Everything a repository writes for itself lives outside that block and is never
# read or rewritten here, because the org convention is that review configuration
# is customised per repository rather than copied wholesale.
name: agents-sync

on:
  workflow_call:
    inputs:
      agents-path:
        description: Path to the AGENTS.md whose shared block is synchronised.
        type: string
        default: AGENTS.md
      canonical-ref:
        description: >-
          Ref of bymaxone/.github to take the canonical block from. Defaults to
          the moving `v1` alias, which is what consumers already reference for
          CI; pin it only to hold a repository back deliberately.
        type: string
        default: v1
      branch:
        description: Branch the synchronisation pull request is opened from.
        type: string
        default: chore/agents-sync
      fail-on-drift:
        description: >-
          Also fail the job when the block is out of date. Off by default: the
          pull request is the signal, and a red scheduled run on the default
          branch is noise nobody can act on differently.
        type: boolean
        default: false
    secrets:
      app-id:
        description: >-
          App ID of a GitHub App installed on the consuming repository with
          contents: write and pull_requests: write. Preferred over sync-token:
          the token is minted per run and expires within the hour, so there is
          no long-lived credential to rotate and none to expire unnoticed.
          Supply both this and app-private-key, or neither.
        required: false
      app-private-key:
        description: >-
          Private key of the app named by app-id. The two are read together;
          supplying one alone is a misconfiguration and the job says so before
          falling back.
        required: false
      sync-token:
        description: >-
          Token used to push the branch and open the pull request. Optional, and
          worth supplying: a pull request opened with the default GITHUB_TOKEN
          does not start workflow runs, so in a repository whose ruleset requires
          checks it cannot be merged until someone pushes to it. A token that is
          not GITHUB_TOKEN does not carry that restriction.
        required: false

permissions:
  contents: read

jobs:
  sync:
    name: agents-sync
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # The `secrets` context is not available in a step's `if` -- an expression
    # naming it there evaluates to empty, so the condition would read false on
    # every run and the App would look uninstalled rather than misconfigured.
    # Job-level env is where `secrets` may be read, so the decision is carried
    # down as env instead. The key itself is deliberately NOT here: a job-level
    # env is readable by every `run:` in the job, and presence is all the
    # condition needs.
    env:
      APP_ID: ${{ secrets.app-id }}
      HAS_APP_KEY: ${{ secrets.app-private-key != '' }}
      HAS_SYNC_TOKEN: ${{ secrets.sync-token != '' }}
    steps:
      # Both or neither. One alone is silent otherwise -- the run falls back and
      # looks like a repository that never configured an App at all.
      - name: Refuse a half-configured App
        if: ${{ (env.APP_ID != '') != (env.HAS_APP_KEY == 'true') }}
        run: |
          echo "::error title=agents-sync::app-id and app-private-key are supplied together or not at all; exactly one is set, so the App cannot be used and the run would silently fall back to sync-token."
          exit 1

      # Ahead of both checkouts: the first one consumes this token.
      - name: Mint an installation token
        id: app-token
        if: ${{ env.APP_ID != '' && env.HAS_APP_KEY == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}

      - name: Check out the consuming repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The synchronisation branch is cut from whatever is checked out here,
          # so it has to be the default branch: a `workflow_dispatch` from another
          # ref, or a same-repository pull request, would otherwise carry that
          # ref's unrelated commits into a pull request opened against the
          # default one.
          ref: ${{ github.event.repository.default_branch }}
          # The push below reuses the credential this step persists, not GH_TOKEN.
          # Without this, a supplied token authorises only the `gh` calls while
          # the push keeps GITHUB_TOKEN -- which a ruleset may exclude, and whose
          # pushes do not start workflow runs on the pull request being updated.
          token: ${{ steps.app-token.outputs.token || secrets.sync-token || github.token }}

      - name: Check out the canonical rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bymaxone/.github
          ref: ${{ inputs.canonical-ref }}
          path: .agents-canonical

      - name: Splice the shared block and open a pull request when it moved
        env:
          # Inputs are read from the environment rather than interpolated into the
          # script, so a value containing shell syntax stays inert text.
          AGENTS_PATH: ${{ inputs.agents-path }}
          BRANCH: ${{ inputs.branch }}
          CANONICAL_REF: ${{ inputs.canonical-ref }}
          HAS_APP_TOKEN: ${{ steps.app-token.outputs.token != '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FAIL_ON_DRIFT: ${{ inputs.fail-on-drift }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.sync-token || github.token }}
        run: |
          set -euo pipefail

          canonical=.agents-canonical/agents/code-review-rules.md
          begin='<!-- shared:begin -->'
          end='<!-- shared:end -->'

          # A repository that has not adopted the shared block yet is not a
          # failure: it opted out, or it has not been wired. Say so and stop.
          if [ ! -f "$AGENTS_PATH" ]; then
            echo "::notice title=agents-sync::$AGENTS_PATH does not exist; nothing to synchronise."
            exit 0
          fi
          # Count markers with the same predicate the splice uses -- at the start
          # of a line -- so a marker mentioned inline in prose is not miscounted.
          begin_count=$(awk -v m="$begin" 'index($0, m) == 1' "$AGENTS_PATH" | wc -l | tr -d ' ')
          end_count=$(awk -v m="$end" 'index($0, m) == 1' "$AGENTS_PATH" | wc -l | tr -d ' ')

          if [ "$begin_count" -eq 0 ] && [ "$end_count" -eq 0 ]; then
            echo "::notice title=agents-sync::$AGENTS_PATH carries no shared block; nothing to synchronise."
            exit 0
          fi

          # Anything other than one pair in order is refused rather than spliced.
          # The awk below inserts at *every* begin marker and suppresses lines
          # until an end marker or EOF, so a duplicated pair copies the canonical
          # block twice and a reversed pair deletes everything after the begin
          # marker -- both of which rewrite rules that live outside the block and
          # break the guarantee that a repository's own rules are never touched.
          begin_at=$(awk -v m="$begin" 'index($0, m) == 1 { print NR; exit }' "$AGENTS_PATH")
          end_at=$(awk -v m="$end" 'index($0, m) == 1 { print NR; exit }' "$AGENTS_PATH")
          if [ "$begin_count" -ne 1 ] || [ "$end_count" -ne 1 ] || [ "$begin_at" -ge "$end_at" ]; then
            echo "::error title=agents-sync::$AGENTS_PATH has an ambiguous shared block (begin x$begin_count, end x$end_count); expected exactly one of each, begin first. Refusing to splice."
            exit 1
          fi

          # `branch` is caller-supplied and this workflow force-pushes it. Pointed
          # at the default branch it would commit straight past review; pointed at
          # an unrelated branch it would replace that branch's commits.
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "::error title=agents-sync::the branch input must not be the default branch ($DEFAULT_BRANCH); the synchronisation branch is force-pushed."
            exit 1
          fi

          # `canonical-ref` may name a release that predates the rules file, and
          # the splice below reads it with getline, which is silent when the file
          # is missing: the shared block would be replaced by nothing and the
          # deletion offered as a pull request. Checked here rather than earlier
          # so a repository that opted out still exits quietly above.
          if [ ! -s "$canonical" ]; then
            echo "::error title=agents-sync::bymaxone/.github@$CANONICAL_REF carries no agents/code-review-rules.md; refusing to splice an empty block."
            exit 1
          fi

          # Rebuild the file as: everything before the marker, the canonical block,
          # everything after. awk rather than sed, because the block is multi-line
          # and contains characters sed would treat as syntax.
          awk -v canonical="$canonical" -v b="$begin" -v e="$end" '
            index($0, b) == 1 { print_block = 1; while ((getline line < canonical) > 0) print line; close(canonical); next }
            index($0, e) == 1 { print_block = 0; next }
            print_block != 1  { print }
          ' "$AGENTS_PATH" > "$AGENTS_PATH.synced"
          mv "$AGENTS_PATH.synced" "$AGENTS_PATH"

          if git diff --quiet -- "$AGENTS_PATH"; then
            echo "✓ shared block is current with bymaxone/.github@$CANONICAL_REF"
            exit 0
          fi

          echo "::warning title=agents-sync::the shared review-rules block is out of date"
          git diff --stat -- "$AGENTS_PATH"

          # Warned where a credential is actually used, not merely where drift
          # exists. A rerun whose branch already carries the tree and whose pull
          # request is still open writes nothing and must not be told it is
          # about to fall back -- that is the steady state of every repository
          # with a sync pull request awaiting merge.
          #
          # `sync-token` is optional and `github.token` is a documented
          # fallback, so this warns rather than refuses: a repository requiring
          # no status checks runs credential-free and merges the result by hand.
          # What cost the time was that the failure never named its cause. An
          # unmapped secret and one mapped to a secret that no longer exists
          # both arrive here empty, so the callee is the only place that can.
          warned_no_credential=''
          warn_no_credential() {
            if [ -z "$warned_no_credential" ] \
              && [ "$HAS_APP_TOKEN" != 'true' ] \
              && [ "$HAS_SYNC_TOKEN" != 'true' ]; then
              echo "::warning title=agents-sync::no usable credential, so this write falls back to github.token. Where an organisation forbids Actions to create pull requests the run fails next, reporting a permission rather than the credential behind it; where it allows them, the pull request starts no workflow runs and cannot satisfy a ruleset that requires them. Pass app-id with app-private-key, or sync-token."
              warned_no_credential=1
            fi
          }

          subject="chore(agents): sync the shared review-rules block"

          # One read of the remote branch answers three questions: whether it
          # exists, whether this workflow is what put it there, and what value to
          # lease the push against. The checkout fetched only the default branch,
          # so without this `origin/$BRANCH` has no remote-tracking value and a
          # bare --force-with-lease is rejected as `stale info` -- on exactly the
          # path this reuses, an open synchronisation pull request.
          remote_sha=""
          if git fetch --no-tags --depth=1 origin "refs/heads/$BRANCH" 2>/dev/null; then
            remote_sha=$(git rev-parse FETCH_HEAD)
            # A lease proves nobody moved the branch between this read and the
            # push. It does not prove the branch is ours to move, so check that
            # its tip is a commit this workflow wrote before replacing it.
            if [ "$(git log -1 --format=%s FETCH_HEAD)" != "$subject" ]; then
              echo "::error title=agents-sync::$BRANCH exists and its tip is not an agents-sync commit; refusing to force-push over it."
              exit 1
            fi
          fi

          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -- "$AGENTS_PATH"
          git commit -m "$subject" -m "Taken from bymaxone/.github@${CANONICAL_REF}, agents/code-review-rules.md.
          Only the block between the shared markers is rewritten; this repository's
          own rules are outside it and untouched."

          # While a synchronisation pull request stays open the default branch
          # still carries the stale block, so every later run rebuilds the same
          # commit. Pushing it would give the pull request a new SHA with an
          # identical tree on every schedule -- rerunning checks and dismissing
          # approvals for nothing. Comparing trees rather than commits still lets
          # a genuine change through, including the default branch moving under an
          # open pull request.
          if [ -n "$remote_sha" ] \
            && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$remote_sha^{tree}")" ]; then
            echo "::notice title=agents-sync::$BRANCH already carries this tree; leaving it where it is."
          else
            # An empty expected value means the branch must not already exist, so
            # a concurrent run still loses the race rather than overwriting it.
            warn_no_credential
            git push --force-with-lease="$BRANCH:$remote_sha" origin "$BRANCH"
          fi

          # Reconciled on every run rather than only after a push, because the
          # branch being correct is not the same as the drift being offered. A run
          # that pushed and was then cancelled or failed here, and a pull request
          # someone closed without merging, both leave a branch whose tree already
          # matches -- so keying this off the push would report success on every
          # later schedule while nothing was open to act on. Reusing an open one
          # keeps a schedule from queueing duplicates.
          # Built once and used for both paths below, so a pull request that
          # stays open through a change to this text does not keep the wording
          # it was created with.
          body="The shared block in \`${AGENTS_PATH}\` is behind \`bymaxone/.github@${CANONICAL_REF}\`.

          Only the content between the \`shared:begin\` and \`shared:end\` markers is rewritten. Rules this repository wrote for itself live outside the block and are untouched.

          Edit the canonical copy in \`bymaxone/.github\` rather than this file — a local edit inside the block is reverted on the next run.

          That includes an edit nobody made on purpose. A repository whose commit hooks format Markdown — \`prettier --write\` through lint-staged, for example — can reformat the block on commit, and the next run reverts the churn silently in a file nobody watches. The canonical copy is kept stable against prettier's **defaults**, so this bites where a repository's own formatter configuration differs from them. If yours does, check the block against the canonical copy after any commit that touches this file.

          Codex reads this file up to \`project_doc_max_bytes\`, 32 KiB by default, and **truncates the rest silently** — no error, no failed check. The block is spliced above this repository's own rules, so what a repository loses when it goes over is its own material, from the end of the file backwards. Keep the rules that invert a reviewer's default near the top: without one of those a reviewer does not merely miss something, it files the finding the rule exists to prevent.

          _Opened by the \`agents-sync\` reusable workflow._"

          # Filtered to this repository's own branch. `--head` matches on branch
          # NAME, so a fork whose branch is also called this selects here too.
          # That was survivable while the result only decided whether to create
          # -- the worst case was skipping a creation -- and is not now that it
          # decides what to overwrite: editing a contributor's pull request body
          # with a synchronisation notice would be this workflow writing outside
          # the repository it was asked to touch.
          open_pr=$(gh pr list --head "$BRANCH" --state open \
            --json number,isCrossRepository \
            --jq 'map(select(.isCrossRepository == false)) | .[0].number // empty')
          if [ -z "$open_pr" ]; then
            warn_no_credential
            gh pr create --head "$BRANCH" --title "$subject" --body "$body"
          else
            # Reconciled rather than left as created. A sync pull request can sit
            # open for weeks -- awaiting a merge, or blocked on an unrelated red
            # check -- and it is exactly those repositories that most need the
            # guidance this body carries. Rewritten only when it actually
            # differs, so a weekly run does not edit the pull request, and
            # notify everybody watching it, to store the bytes it already has.
            # Compared with carriage returns stripped: GitHub returns the body
            # with CRLF line endings, so a byte comparison against the value
            # sent would never match and every scheduled run would edit the
            # pull request -- notifying everyone watching it, weekly, to store
            # bytes it already has.
            if [ "$(gh pr view "$open_pr" --json body --jq .body | tr -d '\r')" = "$(printf '%s' "$body" | tr -d '\r')" ]; then
              echo "::notice title=agents-sync::the open synchronisation pull request already covers this."
            else
              gh pr edit "$open_pr" --body "$body"
              echo "::notice title=agents-sync::refreshed the body of the open synchronisation pull request."
            fi
          fi

          if [ "$FAIL_ON_DRIFT" = "true" ]; then
            exit 1
          fi

      # Runs after the splice, against the tree the pull request would carry, so
      # the numbers describe what a consumer is being offered rather than what it
      # had. Reports on every run and not only on breach: a canonical release that
      # eats 3 KB is then visible as a delta here before it is visible as a
      # failure in the repository with the least room.
      - name: Report the AGENTS.md budget and refuse a nested template
        if: ${{ !cancelled() }}
        env:
          AGENTS_PATH: ${{ inputs.agents-path }}
        run: |
          set -euo pipefail

          # The cap is a Codex setting, so read the repository's own value where it
          # has one. Failing a repository against a number it deliberately moved
          # would be this guard committing the error it exists to catch.
          cap=32768
          if [ -f .codex/config.toml ]; then
            # A TOML integer may carry underscore separators, a leading sign and a
            # 0x/0o/0b radix prefix. Matching only a run of digits reads 65_536 as
            # 65, which is not a wrong cap so much as an invented one: it fails
            # every run, hardest in the repository that deliberately raised it. So
            # take the whole value and convert it, and where it cannot be converted
            # keep the default and say so rather than compute from a fragment.
            raw=$(sed -n 's/^[[:space:]]*project_doc_max_bytes[[:space:]]*=[[:space:]]*\([^#[:space:]]*\).*/\1/p' .codex/config.toml | head -1)
            value=${raw//_/}
            value=${value#+}
            case "$value" in
              '') ;;
              0[xX]*) cap=$((value)) ;;
              0[oO]*) cap=$((8#${value#0[oO]})) ;;
              0[bB]*) cap=$((2#${value#0[bB]})) ;;
              *[!0-9]*) echo "::warning title=agents-sync::could not read project_doc_max_bytes ($raw) from .codex/config.toml; using the $cap default." ;;
              *) cap=$((value)) ;;
            esac
          fi

          [ -f "$AGENTS_PATH" ] || exit 0

          # core.quotePath escapes a non-ASCII path into a quoted C string, which
          # matches nothing on disk: such a file would be silently absent from both
          # the byte count and the template check below.
          nested_docs=$(git -c core.quotePath=false ls-files \
            | grep -E '.+/AGENTS(\.override)?\.md$' || true)

          # What one directory contributes: Codex takes its AGENTS.override.md if it
          # has one, otherwise its AGENTS.md, otherwise nothing. A repository that
          # sets `project_doc_fallback_filenames` adds a third name to that chain,
          # which this does not measure -- unhandled deliberately, because no Bymax
          # repository sets it and a branch nobody exercises is a branch that rots.
          dir_bytes() {
            for candidate in "$1/AGENTS.override.md" "$1/AGENTS.md"; do
              if [ -f "$candidate" ]; then
                wc -c < "$candidate" | tr -d ' '
                return
              fi
            done
            echo 0
          }

          # Codex walks the root down to the directory being worked in, takes at
          # most one file per directory, and stops once the combined size reaches
          # the cap. So the figure to report is the worst single chain, not the sum
          # of every doc in the tree: sibling package docs are never read together,
          # and adding them fails a repository that is under the cap on every path
          # Codex can actually take. Every directory is measured by the one rule
          # above, the root included, so each file is counted exactly once whatever
          # its name and wherever `agents-path` points.
          root_bytes=$(dir_bytes .)
          worst=$root_bytes
          worst_chain="the repository root"
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            total=$root_bytes
            prefix=""
            IFS='/' read -ra segments <<< "$dir"
            for segment in "${segments[@]}"; do
              prefix="${prefix:+$prefix/}$segment"
              total=$((total + $(dir_bytes "$prefix")))
            done
            if [ "$total" -gt "$worst" ]; then
              worst=$total
              worst_chain="the root down to $dir"
            fi
          done <<EOF
          $(printf '%s\n' "$nested_docs" | sed 's#/[^/]*$##' | sort -u)
          EOF

          status=0

          # The block this workflow keeps current lives in $AGENTS_PATH, and Codex
          # prefers an override file in the same directory -- so an override beside
          # it means the synced rules are never read at all. Reported rather than
          # failed: a repository may have done it deliberately.
          override="$(dirname "$AGENTS_PATH")/AGENTS.override.md"
          if [ "$override" != "$AGENTS_PATH" ] && [ -f "$override" ]; then
            echo "::warning title=agents-sync::$override shadows $AGENTS_PATH, so Codex reads the override and never the shared block this workflow keeps current. Merge the two, or move the block into $override."
          fi

          # A nested doc carrying `{{` is a template: a change under its directory
          # would have Codex read a fictional project's specification as this
          # repository's own guidance.
          #
          # Code spans and fences are stripped first, because a document that
          # *explains* the hazard quotes a placeholder to do it, and this
          # organisation writes GitHub expression syntax -- a dollar sign and two
          # braces -- in every workflow example. This is a heuristic and not an
          # exact test: a starter that backticks its own placeholders slips through.
          # That is the direction to be wrong in for a check that fails a build, as
          # a rare miss beats failing a narrowing for stating the rule.
          #
          # Note for whoever edits this comment: Actions interpolates an expression
          # anywhere in this file, inside a run script and its comments included, so
          # writing that syntax literally here makes the workflow file itself
          # invalid -- no jobs, no logs, just a red run. Describe it, never quote it.
          while IFS= read -r nested; do
            [ -n "$nested" ] || continue
            if awk '/^[[:space:]]*```/ { fenced = !fenced; next } !fenced' "$nested" \
              | sed 's/`[^`]*`//g' | grep -q '{{'; then
              echo "::error title=agents-sync::$nested is a template, but under that name Codex reads it as guidance for changes in $(dirname "$nested"). Rename it (for example AGENTS.starter.md)."
              status=1
            fi
          done <<EOF
          $nested_docs
          EOF

          free=$((cap - worst))
          echo "AGENTS.md budget: $worst of $cap ($free free) on the longest chain Codex can read -- $worst_chain" >> "$GITHUB_STEP_SUMMARY"
          if [ "$free" -lt 0 ]; then
            echo "::error title=agents-sync::the chain from $worst_chain is $worst bytes against a $cap cap. Codex stops adding files at the cap, so the tail is dropped with no error and no failed check. Remove or relocate content, and keep the shared block above the material that can be lost."
            status=1
          fi
          exit "$status"
