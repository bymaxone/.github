# Reusable OSV-Scanner gate for Bymax repositories.
#
# This is the audit the other dependency checks here deliberately do NOT do.
# `security.yml` (dependency-review) only sees the packages a pull request ADDS
# in its diff. `peer-advisory-drift.yml` only reads the ranges a package
# DECLARES. Neither notices a dependency that is already installed — a
# transitive package deep in the lockfile — turning vulnerable the day a new
# advisory is published, with no commit, no diff, and no alert to trigger on.
#
# OSV-Scanner reads the full resolved dependency tree (the lockfile) and cross-
# checks every package, direct and transitive, against the OSV database — which
# aggregates GitHub Advisory, the npm registry, RustSec and more. The caller
# runs it on a schedule as well as on push/PR, so the degradation that happens
# between releases, when nobody is looking at the file, still fails a run.
#
# Cost: a checkout and a single scanner invocation. No build, no install of the
# caller's tree — the scanner reads the manifests and lockfile directly.
name: OSV-Scanner

on:
  workflow_call:
    inputs:
      scan-args:
        description: >-
          Newline-separated arguments passed to OSV-Scanner. The default scans
          the whole checkout recursively, which finds every lockfile a workspace
          contains rather than assuming one at the root.
        type: string
        default: |-
          --recursive
          ./

# Read-only. The scanner surfaces findings in the job log and fails the run on a
# vulnerability; it does not write to the repository or upload to code scanning,
# so this stays callable from private repositories (the template included) whose
# default token has no `security-events` grant.
permissions:
  contents: read

jobs:
  scan:
    name: OSV vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Records every outbound connection the job makes, so an unexpected
      # destination — a compromised action exfiltrating, say — is visible after
      # the fact. Audit, not block: the scanner reaches the OSV database and
      # pulls its image from ghcr.io, and a per-repo egress allow-list is more
      # than a read-only dependency scan should carry. Every caller inherits it
      # without opting in.
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      # Without this the scanner runs against an empty workspace: it reports "No
      # package sources found" and "No lockfiles found", then exits 0. The job
      # would be green because it had nothing to read, which is
      # indistinguishable from having nothing to report.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        with:
          scan-args: ${{ inputs.scan-args }}
