# Runs the shared no-ai-attribution job on this repository's own pull requests, from the version of the workflow
# in the same commit, so a change to the rule is checked by the rule it changes.
name: no-ai-attribution

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  attribution:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/no-ai-attribution.yml
