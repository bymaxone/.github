# Reusable CI for Bymax Rust workspaces (rust-* libraries and apps).
#
# The universal Cargo gates live here once: format, clippy, build+test, coverage,
# MSRV, and a source-gated mutation run. Bespoke jobs (wasm, fuzz, feature matrix,
# supply-chain, public-api, npm/web bundles, e2e) stay in each repo's caller.
#
# Event-driven only — the caller triggers it on push/pull_request/workflow_dispatch.
# There is NO cron here. Mutation is the deepest gate and runs ONLY on a push to the
# default branch (or manual dispatch), and only when source changed.
#
# Actions are pinned to a full commit SHA (an immutable supply-chain anchor); the
# trailing `# vX.Y.Z` is the human-readable version kept current by Dependabot.
name: rust-ci

on:
  workflow_call:
    inputs:
      run-build:
        description: Run `cargo build` before the test job (part of build & test).
        type: boolean
        default: true
      run-coverage:
        description: Run the cargo-llvm-cov coverage gate.
        type: boolean
        default: true
      coverage-fail-under:
        description: Minimum line & function coverage percent (hard gate).
        type: number
        default: 100
      run-msrv:
        description: Prove the workspace builds on the MSRV floor.
        type: boolean
        default: true
      msrv-version:
        description: The MSRV toolchain (matches `rust-version` in Cargo.toml).
        type: string
        default: '1.90'
      run-mutation:
        description: Run cargo-mutants on default-branch push / manual dispatch.
        type: boolean
        default: false
      mutation-command:
        description: The cargo-mutants command to run when mutation is triggered.
        type: string
        default: cargo mutants --all-features --in-place
      mutation-source-globs:
        description: Extended-regex of source paths whose change triggers mutation.
        type: string
        default: '^(crates/|src/|bindings/)'

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Two checks that need no toolchain and belong to the tree rather than to the
  # language, so they are identical in every reusable and run without `needs`.
  #
  # actionlint validates the workflows themselves. A workflow file carrying an
  # invalid expression is rejected by Actions wholesale: no jobs start, no logs
  # are produced, and the run reports only "This run likely failed because of a
  # workflow file issue". A YAML parser does not see it, because the file is
  # valid YAML -- the expression is what is malformed. That failure is invisible
  # without a check, which is what makes a red check proportionate here.
  #
  # SC2016 is excluded because a single-quoted `$` in an awk or sed program is
  # deliberate throughout these workflows, and the finding is advice about shell
  # interpolation that does not apply to a program passed to another interpreter.
  #
  # actionlint is fetched in a `run:` step rather than referenced with `uses:`.
  # This organisation restricts Actions to an allow-list, and a reference outside
  # it -- a `docker://` image included, by digest or by tag -- makes Actions
  # reject the whole file at startup: startup_failure, no jobs, no annotations,
  # no logs, nothing to re-run. A downloaded release verified by checksum also
  # pins the artefact itself, which is stronger than a tag or an allow-list entry.
  hygiene:
    name: Workflow and tree hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The authorship check walks the commits this change introduces. On a
          # pull_request the checkout is the merge ref, and at the default depth
          # of 1 its parents are absent -- the range would resolve to nothing and
          # the check would report a pass over zero commits.
          fetch-depth: 0

      - name: Lint the workflow files
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -fsSL -o actionlint.tar.gz "${base}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color -shellcheck="shellcheck -e SC2016"
          rm -f actionlint actionlint.tar.gz

      # Authorship is mechanically decidable, so it is checked rather than
      # reviewed. The shared block asks a reviewer to read the field before
      # reporting it; that guard works, but it is spent on findings that are
      # usually wrong -- seven fabricated commit SHAs across three repositories
      # in one day, each quoting a `git log` that was never run. A check settles
      # every one of those before a person reads it, and unlike prose it also
      # catches a real violation.
      #
      # Scoped to the commits a pull request introduces, never to history: an
      # old commit is not something this author can act on, and asking for
      # history to be rewritten is the expensive mistake the block warns about.
      - name: No AI identity in the commits this change introduces
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          # No --depth here. The checkout above is unshallow, and `git fetch
          # --depth` RE-shallows a complete repository -- it would undo the
          # fetch-depth: 0 two steps up and reintroduce the empty range this
          # check is built to refuse.
          git fetch --quiet origin "$BASE_REF"
          range="origin/${BASE_REF}..HEAD"

          # Identity fields come from the contributor's git configuration, and
          # the trailer comes from the commit body; both are checked, because a
          # change introduces either one the same way.
          #
          # POSIX ERE rather than -P: perl regex is a GNU extension, so a -P
          # pattern cannot be exercised on a BSD grep before it ships here.
          # The word boundaries are spelled out so "Claudia" is not "Claude".
          # One list, used by both patterns. They drifted apart when written
          # separately: the trailer pattern omitted chatgpt, so a
          # `Co-Authored-By: ChatGPT` passed while an author of the same name
          # did not.
          tools='claude|codex|copilot|chatgpt|anthropic|openai'
          identities="(^|[^a-zA-Z])($tools)([^a-zA-Z]|$)|@(anthropic|openai)\.com"
          trailer="co-authored-by:.*($tools)"

          # `grep` exits 1 for "no match" and 2 for a real error, and `|| true`
          # collapses both into success -- which would turn a broken check into a
          # silent pass. Each status is handled on its own.
          match() {
            local out rc
            out=$(printf '%s\n' "$2" | grep -iE "$1") && rc=0 || rc=$?
            case "$rc" in
              0) printf '%s' "$out" ;;
              1) ;;
              *) echo "::error title=authorship::grep failed with status $rc; refusing to report a pass." >&2
                 exit 3 ;;
            esac
          }
          offenders=$(match "$identities" "$(git log "$range" --format='%H %an <%ae> / %cn <%ce>')")
          trailers=$(match "$trailer" "$(git log "$range" --format='%H%n%B')")

          if [ -n "$offenders" ] || [ -n "$trailers" ]; then
            echo "::error title=authorship::a commit in this change attributes authorship to an AI tool. Amend the identity or drop the trailer; the organisation rule is that no commit, pull request or comment does this."
            [ -n "$offenders" ] && printf 'author/committer:\n%s\n' "$offenders"
            [ -n "$trailers" ] && printf 'trailer:\n%s\n' "$trailers"
            exit 1
          fi
          # A pull request always introduces at least one commit. An empty range
          # means the history is not traversable, not that the change is clean --
          # reporting a pass there is the failure this check exists to prevent.
          count=$(git rev-list --count "$range")
          if [ "$count" -eq 0 ]; then
            echo "::error title=authorship::the range $range resolved to no commits, so nothing was checked. This is a checkout-depth problem, not a clean result."
            exit 1
          fi
          echo "no AI identity in $count commit(s)"

      # A directory exists when there is a real file to put in it. This was a
      # review rule until a check could decide it; a grep decides it, so it lives
      # here and the shared block no longer carries the section.
      - name: Refuse empty-directory placeholders
        run: |
          set -euo pipefail
          found=$(git ls-files | grep -E '(^|/)\.(git)?keep$' || true)
          if [ -n "$found" ]; then
            echo "::error title=hygiene::placeholder files for empty directories do not belong in the tree; a directory exists when there is a real file to put in it."
            printf '%s\n' "$found"
            exit 1
          fi

  fmt:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build
        if: inputs.run-build
        run: cargo build --workspace --all-features --locked
      - name: Test (unit + integration + doctests)
        run: cargo test --workspace --all-features --locked

  coverage:
    name: coverage (llvm-cov)
    if: inputs.run-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2.82.2
        with:
          tool: cargo-llvm-cov
      - name: Coverage hard gate
        # The empty-stub guard tolerates the early state where llvm-cov reports
        # "no coverage data found" (zero instrumented functions); any other
        # failure — including a missed threshold — propagates as a hard error.
        run: |
          set -euo pipefail
          cov_err="$(mktemp)"
          if cargo llvm-cov \
              --workspace --all-features --locked \
              --fail-under-lines     ${{ inputs.coverage-fail-under }} \
              --fail-under-functions ${{ inputs.coverage-fail-under }} \
              --lcov --output-path lcov.info \
              2> "$cov_err"; then
            cat "$cov_err" >&2 || true
          elif grep -q 'no coverage data found' "$cov_err"; then
            cat "$cov_err" >&2
            echo 'note: no coverable code yet (empty stubs); emitting an empty LCOV.'
            : > lcov.info
          else
            cat "$cov_err" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: ignore

  msrv:
    name: msrv
    if: inputs.run-msrv
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install the MSRV toolchain
        run: rustup toolchain install ${{ inputs.msrv-version }} --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo +${{ inputs.msrv-version }} build --workspace --locked

  mutation:
    name: mutation (cargo-mutants)
    # The deepest gate. Never on PRs, never on a schedule — only on a push to the
    # default branch or a manual dispatch, and only when source changed.
    needs: [test]
    if: >-
      inputs.run-mutation &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect source changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "Manual dispatch — running mutation."; exit 0
          fi
          base="${{ github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="${{ github.sha }}^"
          fi
          if git diff --name-only "$base" "${{ github.sha }}" | grep -qE '${{ inputs.mutation-source-globs }}'; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "Source changed — running mutation."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "No source changes — skipping mutation."
          fi
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        if: steps.changes.outputs.run == 'true'
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        if: steps.changes.outputs.run == 'true'
      - uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2.82.2
        if: steps.changes.outputs.run == 'true'
        with:
          tool: cargo-mutants
      - name: Run mutation testing
        if: steps.changes.outputs.run == 'true'
        run: ${{ inputs.mutation-command }}
      - name: Upload the mutation report
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-report
          path: mutants.out/
          retention-days: 14
          if-no-files-found: ignore
