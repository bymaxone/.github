# Reusable CodeQL analysis, gated on the repository actually being public.
#
# Why the gate exists: code scanning is free on public repositories and requires
# a paid GitHub Code Security license on private ones, where the SARIF upload is
# refused outright. Repos in this org start private and are opened later, so one
# definition has to be a no-op in the first state and a real scan in the second.
#
# Why the gate is a job and not `if: ${{ !github.event.repository.private }}`:
# that expression is what the per-repo copies use, and it silently fails open on
# the weekly run. The `schedule` event carries no webhook payload — GitHub's own
# trigger reference lists it as "Not applicable" — so `github.event.repository`
# is null there, `!null` evaluates to true, and a private repository would run
# the analysis anyway and fail at the upload. Asking the API costs one short job
# and answers the same on every trigger.
name: codeql

on:
  workflow_call:
    inputs:
      languages:
        description: >-
          JSON array of CodeQL languages to analyse, one job each — for example
          '["javascript-typescript"]' or '["javascript-typescript","rust"]'.
        type: string
        default: '["javascript-typescript"]'
      build-mode:
        description: >-
          CodeQL build mode. `none` suits interpreted languages; a compiled one
          needs `autobuild` or `manual`.
        type: string
        default: none
      harden-runner:
        description: >-
          Run step-security/harden-runner in egress-audit mode before anything
          else. Off by default: it is a third-party action, and adding one to a
          repository that did not ask for it is a supply-chain decision, not a
          detail. Three repos converted to this workflow already ran it, and
          this input is how they keep it.
        type: boolean
        default: false
      queries:
        description: >-
          Query suite handed to the CodeQL init action. Empty selects the default
          suite. It exists because `security-extended` — a superset of the default
          — is what six of the ten repositories converted to this workflow were
          already running, and a caller that forgets it silently analyses less
          than it did before.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  visibility:
    name: Repository visibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      public: ${{ steps.check.outputs.public }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # The assignment sits inside `if`, which `set -e` does not act on, so
          # the retry works without disabling error checking for the rest of the
          # step — a failed write to $GITHUB_OUTPUT must still fail the job.
          visibility=""
          for attempt in 1 2 3; do
            if visibility=$(gh api "repos/$REPO" --jq .visibility 2>/dev/null); then
              break
            fi
            visibility=""
            if [ "$attempt" -lt 3 ]; then
              sleep $(( attempt * 5 ))
            fi
          done

          if [ -z "$visibility" ]; then
            # Degraded rather than failed: a red workflow over a transient API
            # error is noise, and the warning keeps it from being silent.
            echo "::warning::Could not determine repository visibility after 3 attempts; treating it as non-public and skipping."
            echo "public=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "visibility: $visibility"
          if [ "$visibility" = "public" ]; then
            echo "public=true" >> "$GITHUB_OUTPUT"
          else
            # Covers internal as well as private.
            echo "public=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped on a $visibility repository: uploading results needs a GitHub Code Security license, which is only free on public repositories."
          fi

  analyze:
    # The matrix value is spelled into the name on purpose. Without it GitHub
    # appends the matrix values to whatever name is given, which is how a job
    # already called "Analyze (javascript-typescript)" ends up reporting a check
    # named "Analyze (javascript-typescript) (javascript-typescript)".
    name: Analyze (${{ matrix.language }})
    needs: visibility
    if: ${{ needs.visibility.outputs.public == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      # First, so the egress audit sees every later step.
      - name: Harden runner
        if: inputs.harden-runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned to the newest revision already in use across the org. The copies
      # this replaces sat on v4.37.0, v4.37.1 and v4.37.4 — centralising on the
      # oldest would have been a downgrade for three repositories.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ inputs.build-mode }}
          queries: ${{ inputs.queries }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: /language:${{ matrix.language }}
