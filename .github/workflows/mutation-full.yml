# Reusable full mutation run — the cold measurement, on a schedule.
#
# Callers run mutation on every push with `incremental: true` in their Stryker config, which
# re-tests only what changed and finishes inside the minutes a routine gate is allowed to take.
# That is the right trade for a gate on every push, but it IS a trade: an incremental run reuses
# stored verdicts, and Stryker's own guidance is that reused verdicts for STATIC mutants can be
# stale. A score built on reuse is a fast signal, not the truth.
#
# The truth is measured here, cold, once a week. This workflow also refreshes the cache the
# per-push job restores: it saves under the same `stryker-incremental-` prefix `node-lib-ci`
# reads, so every push in the following week starts from a baseline a full run produced rather
# than from a chain of incremental deltas.
#
# The caller owns the schedule (`on: schedule` cannot live in a reusable) and the ceiling.
name: mutation-full

on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: >-
          Wall-clock ceiling for the cold run. Nothing blocks on this job, so an over-wide
          ceiling costs only the minutes it actually uses, while an under-tight one costs a
          whole cancelled run and leaves the week without a measured baseline.
        type: number
        default: 60
      full-command:
        description: >-
          Command that runs the suite cold. It must delete the incremental file first, or the
          run inherits verdicts from the very chain it exists to check.
        type: string
        default: pnpm mutation:full
      score-paths:
        description: >-
          Space-separated pathspecs that can move the score. Deliberately WIDER than the
          per-push job's source glob: that one decides whether to re-measure after a change to
          production code; this one decides whether the SCORE can have moved, and the score also
          moves when a test changes (a new test kills a mutant that survived), when the Stryker
          or Jest configuration changes (which mutants exist, which tests select them), or when
          a dependency changes underneath the suite. Gating on `src/` alone would skip exactly
          the week where someone spent their time writing tests — the week most likely to change
          the number. A pathspec that does not exist in the caller matches nothing and is
          harmless, so the default is a superset.
        type: string
        default: >-
          src/ test/ package.json pnpm-lock.yaml stryker.config.json jest.config.ts
          jest.stryker.config.ts jest.coverage.config.ts tsconfig.json tsconfig.jest.json
      inventory:
        description: >-
          What to do when the unit suite has a test the mutation run did not run: `warn` reports
          it and passes, `enforce` fails the job, `off` skips the comparison. Stryker picks each
          run's tests through Jest's related-test lookup, which follows imports only inside
          Jest's `roots`, so a spec that reaches the source through a helper outside them is
          never run and the score cannot notice. `warn` is the default so that adopting this
          release turns nothing red.
        type: string
        default: warn
      inventory-exempt:
        description: >-
          JSON file listing spec files the run may leave out, as `[{ "file", "reason" }]`. Absent
          at the default path means none.
        type: string
        default: scripts/mutation-inventory.exempt.json
      inventory-jest-config:
        description: The library's unit Jest config, whose tests the mutation run must have run.
        type: string
        default: jest.config.ts
      shards:
        description: >-
          How many runners to split the cold run across. `1` is the single job, exactly as it has
          always run. Above 1 the files are partitioned into balanced slices, each cold-run on its
          own runner, and one job merges the reports, scores them, enforces the break threshold and
          saves the baseline. Each shard pays its own dry run, so total CPU rises by about that much
          per extra shard; the gain is that no runner holds the whole run, in time or in memory.
        type: number
        default: 1
      concurrency:
        description: >-
          Stryker workers per shard. `0` keeps the caller's configured value. Sized against one
          runner's memory: workers grow to several GiB each over a long run, so a shard's workers
          must fit the runner together with the parent process.
        type: number
        default: 0
      stryker-config:
        description: >-
          The caller's Stryker configuration, read to find the files to mutate and written back,
          with per-shard overrides, as each shard's own config. Used only when `shards` is above 1.
        type: string
        default: stryker.config.json
      break-threshold:
        description: >-
          Minimum merged mutation score, enforced by the aggregate job when `shards` is above 1.
          Empty takes `thresholds.break` from the Stryker configuration.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  full:
    name: Full mutation run
    # Default branch only, and this is a correctness guard rather than tidiness. A caller's
    # `workflow_dispatch` can be aimed at any ref, and the save step below writes under the
    # generic `stryker-incremental-` prefix the per-push job restores from. A manual run on a
    # feature branch would therefore hand the default branch's CI a baseline built from code
    # that is not on it — verdicts reused for mutants that no longer exist, or missing for ones
    # that do. That window is exactly where an incremental run is least trustworthy.
    if: inputs.shards == 1 && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      # `gh run list`, in the step that decides whether anything can have moved the score.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the step below diffs against the commit the last successful run
          # measured, which is arbitrarily far back.
          fetch-depth: 0

      - name: Decide whether anything can have moved the score
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          SCORE_PATHS: ${{ inputs.score-paths }}
          # The CALLER's workflow file, derived rather than hardcoded. `github.workflow_ref`
          # reads `owner/repo/.github/workflows/<file>@refs/heads/<branch>`, and `gh run list
          # --workflow` matches the file in the caller's repository. Hardcoding a name here
          # would mean a caller that names its file anything else silently finds no previous
          # run — forever, and green, because "no previous run" fails open into running.
          WORKFLOW_REF: ${{ github.workflow_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT: ${{ github.event_name }}
        # A week with no relevant change produces the same verdict as the week before, and this
        # run costs real minutes to say so.
        #
        # A manual dispatch always runs: asking for it IS the decision.
        run: |
          set -euo pipefail

          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — running."
            exit 0
          fi

          workflow_file="${WORKFLOW_REF%@*}"
          workflow_file="${workflow_file##*/}"
          echo "Comparing against the last successful run of $workflow_file."

          # `|| true` is load-bearing under `set -e`: without it a transient API failure kills
          # the step, which is the opposite of failing open. An empty result falls through to
          # the "no previous run" branch below and runs the suite.
          last="$(gh run list --workflow "$workflow_file" --status success \
            --branch "$DEFAULT_BRANCH" --limit 1 \
            --json headSha --jq '.[0].headSha // empty' 2>/dev/null || true)"

          if [ -z "$last" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "No previous successful run to compare against — running."
            exit 0
          fi

          # An unreachable SHA (history rewritten, or the commit garbage-collected) is not a
          # reason to skip: it is a reason to stop trusting the comparison.
          if ! git cat-file -e "${last}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Last measured commit $last is unreachable — running."
            exit 0
          fi

          # Unquoted on purpose: SCORE_PATHS is a space-separated pathspec list and must split.
          # shellcheck disable=SC2086
          if git diff --quiet "$last" HEAD -- $SCORE_PATHS; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Nothing that can move the score changed since $last — skipping."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Changed since $last:"
            # shellcheck disable=SC2086
            git diff --name-only "$last" HEAD -- $SCORE_PATHS
          fi

      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
        if: steps.changed.outputs.run == 'true'

      - name: Run the full mutation suite
        if: steps.changed.outputs.run == 'true'
        run: ${{ inputs.full-command }}

      - name: Check the mutation run ran every unit test
        # Before the baseline is saved, so that a report that cannot be read never becomes the
        # baseline the week's pushes reuse. In `warn` mode this passes either way.
        if: steps.changed.outputs.run == 'true' && inputs.inventory != 'off'
        uses: bymaxone/.github/.github/actions/mutation-inventory@v1
        with:
          mode: ${{ inputs.inventory }}
          exempt: ${{ inputs.inventory-exempt }}
          jest-config: ${{ inputs.inventory-jest-config }}

      - name: Save the incremental baseline for the week's pushes
        # Only on success, and for the same reason the job is pinned to the default branch:
        # this file becomes the baseline every push that week reuses. Stryker writes it as it
        # goes, so a run that dies partway through leaves a REAL file describing a fraction of
        # the mutants — and the per-push gate cannot tell that apart from a complete one. It
        # would silently treat the unmeasured remainder as unchanged. A failed run leaving the
        # previous week's baseline in place is the safe outcome: stale beats wrong.
        if: steps.changed.outputs.run == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}

      - name: Upload the mutation report
        # `always()` so a failed run still uploads its partial report, but only when the suite
        # actually ran — a skipped week has nothing to upload.
        if: always() && steps.changed.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-full
          path: reports/mutation/
          if-no-files-found: ignore

  # --- Sharded path (`shards` > 1) -------------------------------------------------------------
  #
  # The single job above holds every mutant on one runner. Past a size that stops fitting: a Stryker
  # worker grows to several GiB over a long run, so the runner's memory runs out before the work
  # does, and the runner is lost rather than the job failing. Lowering `concurrency` makes it fit
  # and makes it slower; sharding splits the files across runners and keeps scaling with the mutant
  # count. These three jobs run only when `shards` is above 1, so a caller that does not opt in
  # sees the single job and nothing else.
  #
  # Every script they run comes from this repository at the commit of THIS workflow file
  # (`job.workflow_sha`), not from a tag: the scripts and the file that calls them can never be
  # out of step, and a change here can be proven from a workflow in this repository before any
  # tag moves.

  plan:
    name: Plan mutation shards
    # Same default-branch guard as the single job, for the same reason: the aggregate job saves the
    # baseline the default branch's pushes restore.
    if: inputs.shards > 1 && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # `gh run list` / `gh run download`: the last run's report weights the split.
      actions: read
    outputs:
      run: ${{ steps.changed.outputs.run }}
      matrix: ${{ steps.plan.outputs.matrix }}
      started: ${{ steps.start.outputs.epoch }}
    steps:
      - name: Note when the sharded run started
        id: start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Decide whether anything can have moved the score
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          SCORE_PATHS: ${{ inputs.score-paths }}
          # The CALLER's workflow file, derived rather than hardcoded. `github.workflow_ref`
          # reads `owner/repo/.github/workflows/<file>@refs/heads/<branch>`, and `gh run list
          # --workflow` matches the file in the caller's repository. Hardcoding a name here
          # would mean a caller that names its file anything else silently finds no previous
          # run — forever, and green, because "no previous run" fails open into running.
          WORKFLOW_REF: ${{ github.workflow_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT: ${{ github.event_name }}
        # A week with no relevant change produces the same verdict as the week before, and this
        # run costs real minutes to say so.
        #
        # A manual dispatch always runs: asking for it IS the decision.
        run: |
          set -euo pipefail

          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — running."
            exit 0
          fi

          workflow_file="${WORKFLOW_REF%@*}"
          workflow_file="${workflow_file##*/}"
          echo "Comparing against the last successful run of $workflow_file."

          # `|| true` is load-bearing under `set -e`: without it a transient API failure kills
          # the step, which is the opposite of failing open. An empty result falls through to
          # the "no previous run" branch below and runs the suite.
          last="$(gh run list --workflow "$workflow_file" --status success \
            --branch "$DEFAULT_BRANCH" --limit 1 \
            --json headSha --jq '.[0].headSha // empty' 2>/dev/null || true)"

          if [ -z "$last" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "No previous successful run to compare against — running."
            exit 0
          fi

          # An unreachable SHA (history rewritten, or the commit garbage-collected) is not a
          # reason to skip: it is a reason to stop trusting the comparison.
          if ! git cat-file -e "${last}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Last measured commit $last is unreachable — running."
            exit 0
          fi

          # Unquoted on purpose: SCORE_PATHS is a space-separated pathspec list and must split.
          # shellcheck disable=SC2086
          if git diff --quiet "$last" HEAD -- $SCORE_PATHS; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Nothing that can move the score changed since $last — skipping."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Changed since $last:"
            # shellcheck disable=SC2086
            git diff --name-only "$last" HEAD -- $SCORE_PATHS
          fi


      - name: Require this workflow's own commit
        # `job.workflow_*` names the reusable workflow's repository and commit. If it were ever
        # empty, the checkout below would fall back to the CALLER's default branch and run its
        # files as tooling, so an empty or malformed value stops the job instead.
        if: steps.changed.outputs.run == 'true'
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [ -z "$WORKFLOW_REPOSITORY" ] || ! printf '%s' "$WORKFLOW_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error title=Mutation shards::job.workflow_repository='$WORKFLOW_REPOSITORY' job.workflow_sha='$WORKFLOW_SHA' is not a repository and a commit."
            exit 1
          fi

      - name: Fetch the shard tooling from this workflow's own commit
        if: steps.changed.outputs.run == 'true'
        # Outside the workspace: this job runs the caller's own suite there, and a file of ours in
        # the tree is a file its tests can count (an instruction-file budget, a licence check).
        # `actions/checkout` cannot write outside the workspace, and its sparse mode is cone mode,
        # which also brings every file at this repository's root. So the tarball of the exact
        # commit is read, and only the scripts are extracted. Every failure here stops the job.
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error title=Mutation shards::$1"; exit 1; }
          [ -n "$GH_TOKEN" ] || fail "There is no token to read the tooling with."
          tooling="$RUNNER_TEMP/mutation-tooling"
          archive="$RUNNER_TEMP/mutation-tooling.tar.gz"
          rm -rf "$tooling" "$archive"
          mkdir -p "$tooling"
          status=$(curl --silent --show-error --location --output "$archive" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$WORKFLOW_REPOSITORY/tarball/$WORKFLOW_SHA")
          [ "$status" = 200 ] || fail "Reading $WORKFLOW_REPOSITORY at $WORKFLOW_SHA answered HTTP $status."
          top=$(tar -tzf "$archive" | sed -n 1p)
          [[ "$top" =~ ^[^/]+-${WORKFLOW_SHA:0:7}/$ ]] || fail "The archive's top directory '$top' does not name commit ${WORKFLOW_SHA:0:7}."
          tar -xzf "$archive" -C "$tooling" --strip-components=1 "${top}.github/scripts/mutation-shards"
          for script in plan shard-config collect merge score; do
            [ -f "$tooling/.github/scripts/mutation-shards/$script.mjs" ] || fail "$script.mjs is not in the tooling at $WORKFLOW_SHA."
          done
          echo "MUTATION_TOOLS=$tooling/.github/scripts/mutation-shards" >> "$GITHUB_ENV"

      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
        if: steps.changed.outputs.run == 'true'

      - name: Fetch the last run's report, to weight the split
        if: steps.changed.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        # Best effort and never fatal: with no report the plan falls back to file size.
        run: |
          set -uo pipefail
          workflow_file="${WORKFLOW_REF%@*}"
          workflow_file="${workflow_file##*/}"
          run_id="$(gh run list --workflow "$workflow_file" --status success \
            --branch "$DEFAULT_BRANCH" --limit 1 --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)"
          if [ -z "$run_id" ]; then
            echo "No previous successful run; the split will use file sizes."
            exit 0
          fi
          if gh run download "$run_id" --name mutation-full --dir "$RUNNER_TEMP/mutation-weights" 2>/dev/null \
            && [ -f "$RUNNER_TEMP/mutation-weights/mutation.json" ]; then
            echo "Weighting the split by run $run_id."
          else
            echo "Run $run_id has no mutation report; the split will use file sizes."
          fi

      - name: Split the files into shards
        id: plan
        if: steps.changed.outputs.run == 'true'
        env:
          SHARDS: ${{ inputs.shards }}
          STRYKER_CONFIG: ${{ inputs.stryker-config }}
        run: |
          set -euo pipefail
          weights=()
          if [ -f "$RUNNER_TEMP/mutation-weights/mutation.json" ]; then
            weights=(--weights "$RUNNER_TEMP/mutation-weights/mutation.json")
          fi
          node "$MUTATION_TOOLS/plan.mjs" \
            --config "$STRYKER_CONFIG" --shards "$SHARDS" --out "$RUNNER_TEMP/mutation-plan" \
            ${weights[@]+"${weights[@]}"} | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Tooling commit: ${{ job.workflow_sha }} from ${{ job.workflow_repository }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the plan
        if: steps.changed.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-plan
          path: ${{ runner.temp }}/mutation-plan/plan.json
          if-no-files-found: error

  shard:
    name: Mutation shard
    needs: plan
    if: needs.plan.outputs.run == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    strategy:
      # One lost shard must not cancel the others: it is rerun alone, and the others' work stands.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require this workflow's own commit
        # `job.workflow_*` names the reusable workflow's repository and commit. If it were ever
        # empty, the checkout below would fall back to the CALLER's default branch and run its
        # files as tooling, so an empty or malformed value stops the job instead.
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [ -z "$WORKFLOW_REPOSITORY" ] || ! printf '%s' "$WORKFLOW_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error title=Mutation shards::job.workflow_repository='$WORKFLOW_REPOSITORY' job.workflow_sha='$WORKFLOW_SHA' is not a repository and a commit."
            exit 1
          fi

      - name: Fetch the shard tooling from this workflow's own commit
        # Outside the workspace: this job runs the caller's own suite there, and a file of ours in
        # the tree is a file its tests can count (an instruction-file budget, a licence check).
        # `actions/checkout` cannot write outside the workspace, and its sparse mode is cone mode,
        # which also brings every file at this repository's root. So the tarball of the exact
        # commit is read, and only the scripts are extracted. Every failure here stops the job.
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error title=Mutation shards::$1"; exit 1; }
          [ -n "$GH_TOKEN" ] || fail "There is no token to read the tooling with."
          tooling="$RUNNER_TEMP/mutation-tooling"
          archive="$RUNNER_TEMP/mutation-tooling.tar.gz"
          rm -rf "$tooling" "$archive"
          mkdir -p "$tooling"
          status=$(curl --silent --show-error --location --output "$archive" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$WORKFLOW_REPOSITORY/tarball/$WORKFLOW_SHA")
          [ "$status" = 200 ] || fail "Reading $WORKFLOW_REPOSITORY at $WORKFLOW_SHA answered HTTP $status."
          top=$(tar -tzf "$archive" | sed -n 1p)
          [[ "$top" =~ ^[^/]+-${WORKFLOW_SHA:0:7}/$ ]] || fail "The archive's top directory '$top' does not name commit ${WORKFLOW_SHA:0:7}."
          tar -xzf "$archive" -C "$tooling" --strip-components=1 "${top}.github/scripts/mutation-shards"
          for script in plan shard-config collect merge score; do
            [ -f "$tooling/.github/scripts/mutation-shards/$script.mjs" ] || fail "$script.mjs is not in the tooling at $WORKFLOW_SHA."
          done
          echo "MUTATION_TOOLS=$tooling/.github/scripts/mutation-shards" >> "$GITHUB_ENV"

      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-plan
          path: ${{ runner.temp }}/mutation-plan

      - name: Run this shard cold
        env:
          SHARD: ${{ matrix.shard }}
          CONCURRENCY: ${{ inputs.concurrency }}
          STRYKER_CONFIG: ${{ inputs.stryker-config }}
        # The shard config carries its slice, its own incremental and report files, and no break
        # threshold: a slice scores only itself, so the caller's break is enforced once, on the
        # merged score. A run that fails here therefore failed for a real reason.
        run: |
          set -euo pipefail
          tools="$MUTATION_TOOLS"
          mkdir -p reports/mutation
          node "$tools/shard-config.mjs" --config "$STRYKER_CONFIG" --plan "$RUNNER_TEMP/mutation-plan/plan.json" \
            --index "$SHARD" --concurrency "$CONCURRENCY" --out ".stryker-shard-$SHARD.json"

          # Memory and disk into the log every 15 s: a lost runner leaves no other trace.
          sample() {
            while :; do
              printf '%s rss_mib=%s avail_mib=%s tmp_mib=%s disk_free_gib=%s\n' \
                "$(date -u +%H:%M:%S)" \
                "$(ps -eo rss= | awk '{s += $1} END {printf "%d", s / 1024}')" \
                "$(awk '/MemAvailable/ {printf "%d", $2 / 1024}' /proc/meminfo)" \
                "$(du -sm .stryker-tmp 2>/dev/null | cut -f1 || true)" \
                "$(df -BG --output=avail . | tail -1 | tr -dc 0-9)"
              sleep 15
            done
          }
          sample > "reports/shard-$SHARD.resources" &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT

          TIMEFORMAT='wall=%R user=%U sys=%S'
          { time pnpm exec stryker run ".stryker-shard-$SHARD.json" 2>&1 | tee "reports/shard-$SHARD.log"; } \
            2> "reports/shard-$SHARD.timing"
          cat "reports/shard-$SHARD.timing"

          peak=$(awk -F'rss_mib=' '{split($2, a, " "); if (a[1] + 0 > m) m = a[1] + 0} END {print m + 0}' "reports/shard-$SHARD.resources")
          dry=$(grep -o 'Initial test run succeeded.*' "reports/shard-$SHARD.log" | head -1 | sed 's/\x1b\[[0-9;]*m//g' || true)
          {
            cat "reports/shard-$SHARD.timing"
            echo "peak_rss_mib=$peak"
            echo "dry_run=$dry"
          } > "reports/shard-$SHARD.meta"
          echo "- shard $SHARD: $(cat "reports/shard-$SHARD.timing"), peak RSS ${peak} MiB. ${dry}" >> "$GITHUB_STEP_SUMMARY"

      - name: Write this shard's score and counts to the summary
        # Its own step, before the upload and best-effort: if the artifact service fails, a finished
        # shard still leaves its score, counts and files in the run page, and a failure here (a
        # report that cannot be scored) must never turn a completed shard into a failed one.
        if: always()
        continue-on-error: true
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          tools="$MUTATION_TOOLS"
          [ -f "reports/stryker-shard-$SHARD.json" ] || { echo "No report for shard $SHARD."; exit 0; }
          {
            echo "- shard $SHARD score and counts (its own slice, no break threshold applied):"
            # score.mjs also appends to the summary itself; unset here so the line appears once,
            # indented under this shard.
            env -u GITHUB_STEP_SUMMARY node "$tools/score.mjs" --report "reports/stryker-shard-$SHARD.json" --config ".stryker-shard-$SHARD.json" | sed 's/^/  - /'
            echo "  - files: $(node -p 'require(process.env.RUNNER_TEMP + "/mutation-plan/plan.json").shards.find((s) => s.index === Number(process.argv[1])).files.join(", ")' "$SHARD")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload this shard's report
        id: upload
        # `always()` so a shard that died still leaves its log and resource curve for diagnosis.
        # Only the incremental file feeds the aggregate, and that job does not run after a failure.
        # `continue-on-error` so a failed first attempt does not end the job before the retry; the
        # retry carries the failure if it fails too.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: |
            reports/stryker-shard-${{ matrix.shard }}.json
            reports/shard-${{ matrix.shard }}.meta
            reports/shard-${{ matrix.shard }}.resources
            reports/shard-${{ matrix.shard }}.log
          if-no-files-found: ignore

      - name: Wait before retrying the upload
        if: always() && steps.upload.outcome == 'failure'
        run: sleep 60

      - name: Upload this shard's report again
        # A distinct artifact name, because a failed first attempt can leave a half-created artifact
        # under its own. The aggregate accepts exactly one of the two names per shard.
        if: always() && steps.upload.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-shard-${{ matrix.shard }}-retry
          path: |
            reports/stryker-shard-${{ matrix.shard }}.json
            reports/shard-${{ matrix.shard }}.meta
            reports/shard-${{ matrix.shard }}.resources
            reports/shard-${{ matrix.shard }}.log
          if-no-files-found: ignore

  aggregate:
    name: Aggregate mutation shards
    needs: [plan, shard]
    # `needs` already stops this when any shard failed. The condition below only restates that the
    # run was not skipped, because a skipped dependency must not read as a success here.
    if: needs.plan.outputs.run == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require this workflow's own commit
        # `job.workflow_*` names the reusable workflow's repository and commit. If it were ever
        # empty, the checkout below would fall back to the CALLER's default branch and run its
        # files as tooling, so an empty or malformed value stops the job instead.
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [ -z "$WORKFLOW_REPOSITORY" ] || ! printf '%s' "$WORKFLOW_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error title=Mutation shards::job.workflow_repository='$WORKFLOW_REPOSITORY' job.workflow_sha='$WORKFLOW_SHA' is not a repository and a commit."
            exit 1
          fi

      - name: Fetch the shard tooling from this workflow's own commit
        # Outside the workspace: this job runs the caller's own suite there, and a file of ours in
        # the tree is a file its tests can count (an instruction-file budget, a licence check).
        # `actions/checkout` cannot write outside the workspace, and its sparse mode is cone mode,
        # which also brings every file at this repository's root. So the tarball of the exact
        # commit is read, and only the scripts are extracted. Every failure here stops the job.
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error title=Mutation shards::$1"; exit 1; }
          [ -n "$GH_TOKEN" ] || fail "There is no token to read the tooling with."
          tooling="$RUNNER_TEMP/mutation-tooling"
          archive="$RUNNER_TEMP/mutation-tooling.tar.gz"
          rm -rf "$tooling" "$archive"
          mkdir -p "$tooling"
          status=$(curl --silent --show-error --location --output "$archive" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$WORKFLOW_REPOSITORY/tarball/$WORKFLOW_SHA")
          [ "$status" = 200 ] || fail "Reading $WORKFLOW_REPOSITORY at $WORKFLOW_SHA answered HTTP $status."
          top=$(tar -tzf "$archive" | sed -n 1p)
          [[ "$top" =~ ^[^/]+-${WORKFLOW_SHA:0:7}/$ ]] || fail "The archive's top directory '$top' does not name commit ${WORKFLOW_SHA:0:7}."
          tar -xzf "$archive" -C "$tooling" --strip-components=1 "${top}.github/scripts/mutation-shards"
          for script in plan shard-config collect merge score; do
            [ -f "$tooling/.github/scripts/mutation-shards/$script.mjs" ] || fail "$script.mjs is not in the tooling at $WORKFLOW_SHA."
          done
          echo "MUTATION_TOOLS=$tooling/.github/scripts/mutation-shards" >> "$GITHUB_ENV"

      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-plan
          path: ${{ runner.temp }}/mutation-plan

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-shard-*
          path: ${{ runner.temp }}/mutation-shards

      - name: Merge the shard reports
        id: merge
        # Everything this job downloads or fetches lives under the runner temp directory, so the
        # caller's tree holds nothing of ours while its suite runs. `reports/` stays at the
        # workspace path because the inventory step, the cache save and the artifact upload read it
        # there; it is a directory the caller's own Stryker config already writes to and ignores.
        env:
          STRYKER_CONFIG: ${{ inputs.stryker-config }}
        run: |
          set -euo pipefail
          tools="$MUTATION_TOOLS"
          # Captured first: a failure inside a process substitution would not stop the script.
          listed=$(node "$tools/collect.mjs" --plan "$RUNNER_TEMP/mutation-plan/plan.json" --dir "$RUNNER_TEMP/mutation-shards")
          mapfile -t files <<< "$listed"
          mkdir -p reports/mutation
          node "$tools/merge.mjs" --plan "$RUNNER_TEMP/mutation-plan/plan.json" --config "$STRYKER_CONFIG" \
            --out reports/stryker-incremental.json --shards "${files[@]}"
          # The same file under the name the next run's plan reads its weights from.
          cp reports/stryker-incremental.json reports/mutation/mutation.json

      - name: Score the merged report and enforce the break threshold
        env:
          STRYKER_CONFIG: ${{ inputs.stryker-config }}
          BREAK_THRESHOLD: ${{ inputs.break-threshold }}
        run: |
          set -euo pipefail
          echo "### Mutation score" >> "$GITHUB_STEP_SUMMARY"
          node "$MUTATION_TOOLS/score.mjs" \
            --report reports/stryker-incremental.json --config "$STRYKER_CONFIG" --break "$BREAK_THRESHOLD"

      - name: Check the mutation run ran every unit test
        # On the MERGED report, and before the baseline is saved, for the reason the single job
        # gives. A spec that ran in any shard counts as run.
        if: inputs.inventory != 'off'
        uses: bymaxone/.github/.github/actions/mutation-inventory@v1
        with:
          mode: ${{ inputs.inventory }}
          exempt: ${{ inputs.inventory-exempt }}
          jest-config: ${{ inputs.inventory-jest-config }}

      - name: Report time and CPU
        if: always()
        env:
          RUN_STARTED: ${{ needs.plan.outputs.started }}
        run: |
          set -uo pipefail
          now=$(date +%s)
          start="$RUN_STARTED"
          total_user=0
          {
            echo "### Mutation run cost"
            for meta in $(find "$RUNNER_TEMP/mutation-shards" -name 'shard-*.meta' | sort); do
              user=$(sed -n 's/.*user=\([0-9.]*\).*/\1/p' "$meta" | head -1)
              total_user=$(awk -v a="$total_user" -v b="${user:-0}" 'BEGIN {printf "%.1f", a + b}')
              echo "- $(basename "$meta" .meta): $(grep -m1 wall= "$meta"); $(grep -m1 peak_rss_mib "$meta"); $(grep -m1 dry_run= "$meta" | cut -c1-160)"
            done
            echo "- total: wall $((now - start)) s since the run started, user CPU ${total_user} s across all shards"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save the incremental baseline for the week's pushes
        # Only on success and only on the default branch, for the reasons the single job gives: a
        # run that did not measure every file must never become the baseline.
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}

      - name: Upload the merged mutation report
        if: always() && steps.merge.conclusion == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-full
          path: reports/mutation/
          if-no-files-found: ignore
