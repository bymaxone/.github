# Guards the one file in this repository that is copied into every other one.
#
# `agents/code-review-rules.md` is spliced verbatim into each consumer's
# AGENTS.md by `agents-sync`. A consumer whose CI formats markdown then checks a
# file it did not write and cannot fix: the correction has to happen here, and a
# local edit there is reverted on the next run. So a formatting defect authored
# here is invisible to its author and red for everybody else, which is what makes
# a check proportionate on this file and not on the rest of this repository's
# markdown -- most of which prettier would also rewrite, and none of which
# travels anywhere.
#
# This has happened before. The block was already reformatted once, in "store the
# canonical block in the form a formatter keeps", and regressed on the next edit
# that added a rule. A convention nobody can see at authoring time needs a gate
# rather than a memory.
name: repo-guards

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    name: Canonical block is formatter-stable
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Pinned rather than floating, so a prettier release cannot turn every
      # consumer red without a commit here first. Run with no configuration
      # because consumers apply their own, and prettier's defaults are what a
      # repository with no markdown overrides uses -- which is the case in the
      # consumers checked when this was written.
      - name: Check the block against prettier defaults
        run: |
          set -euo pipefail
          if ! npx --yes prettier@3.6.2 --check agents/code-review-rules.md; then
            echo "::error title=canonical-block::agents/code-review-rules.md is not formatter-stable. It is spliced verbatim into every consumer's AGENTS.md, so a consumer whose CI formats markdown goes red on a file it cannot fix. Run: npx prettier@3.6.2 --write agents/code-review-rules.md"
            exit 1
          fi

      # The splice refuses anything other than one pair in order, and a block
      # that lost a marker here would be offered to every consumer as a deletion.
      - name: Check the shared markers
        run: |
          set -euo pipefail
          begin=$(grep -c '^<!-- shared:begin -->' agents/code-review-rules.md || true)
          end=$(grep -c '^<!-- shared:end -->' agents/code-review-rules.md || true)
          if [ "$begin" != "1" ] || [ "$end" != "1" ]; then
            echo "::error title=canonical-block::expected exactly one shared:begin and one shared:end (found $begin and $end)."
            exit 1
          fi
          head -1 agents/code-review-rules.md | grep -q '^<!-- shared:begin -->'
          tail -1 agents/code-review-rules.md | grep -q '^<!-- shared:end -->'

  actions-policy:
    name: Action references are inside the org allow-list
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # A `uses:` outside the organisation's allow-list is rejected when a
      # workflow STARTS: the whole file is refused, with no jobs, no annotations
      # and no logs. This repository publishes reusable workflows and consumes
      # none of them, so nothing here ever executes what it ships -- the first
      # run of a new reference is in a consumer, after a release. That is exactly
      # how `uses: docker://rhysd/actionlint` reached twenty repositories and
      # took every node-lib-ci consumer down at startup.
      #
      # Composite actions and starter templates are scanned as well as
      # workflows. The actions run inside the reusables, so a reference added
      # there reaches every consumer the same way; the templates are copied into
      # new repositories, so a bad reference there is seeded rather than shared.
      # All three are gated identically at startup, so all three are scanned.
      #
      # This reads a mirrored copy of the list rather than the API, because the
      # endpoint serving it needs an org-admin scope GITHUB_TOKEN does not have.
      # The copy is only safe in one direction, and it is worth being exact
      # about which: a pattern ADDED to the policy but missing here fails a
      # reference that would actually work, which is loud and harmless. A
      # pattern REMOVED from the policy but still listed here passes a reference
      # that consumers will reject at startup -- the mirror cannot detect its own
      # staleness, so refresh it when the org policy narrows.
      - name: Check every action reference against the allow-list
        run: |
          set -euo pipefail

          # PyYAML is ambient on ubuntu-latest today -- this job has run green on
          # it -- but that is the runner image's choice, not a contract. Install
          # it only if the import fails, so the guard does not become the thing
          # that breaks when the image changes.
          python3 -c 'import yaml' 2>/dev/null \
            || python3 -m pip install --quiet --disable-pip-version-check pyyaml

          python3 - <<'CHECK'
          import pathlib, re, sys, yaml

          # The reference set is taken from the PARSED yaml, not from a grep.
          # Four review rounds each found another spelling a pattern missed --
          # flow-style steps, quoted scalars, spacing after `uses:`, spacing
          # after the sequence hyphen. They are all the same defect: a regular
          # expression approximating a YAML parser. The parser has no such gaps.
          ROOTS = ("workflows", "actions", "workflow-templates")
          SHA = re.compile(r"^[0-9a-f]{40}$")

          def references(node):
              """Every `uses:` value anywhere in a parsed document."""
              if isinstance(node, dict):
                  for k, v in node.items():
                      if k == "uses" and isinstance(v, str):
                          yield v
                      else:
                          yield from references(v)
              elif isinstance(node, list):
                  for v in node:
                      yield from references(v)

          allow, verified = set(), set()
          for line in pathlib.Path(".github/actions-allowlist.txt").read_text().splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              (verified if line.startswith("verified:") else allow).add(line)

          status = 0
          for root in ROOTS:
              for path in sorted(pathlib.Path(".github", root).rglob("*")):
                  if path.suffix not in (".yml", ".yaml"):
                      continue
                  doc = yaml.safe_load(path.read_text())
                  for ref in references(doc):
                      if ref.startswith("./") or ref.startswith("bymaxone/"):
                          continue
                      if ref.startswith("docker://"):
                          print(f"::error title=actions-policy::{path}: {ref} is a container "
                                "reference. The allow-list gates it the way it gates an action, "
                                "and a rejection is a startup failure with no logs. Fetch the "
                                "tool in a run: step instead.")
                          status = 1
                          continue

                      name, _, rev = ref.partition("@")
                      owner = name.split("/")[0]

                      # Covered by policy: github-owned, an allow-list pattern,
                      # or a verified creator the mirror records.
                      covered = (owner == "actions"
                                 or f"{name}@*" in allow
                                 or f"verified:{owner}" in verified)
                      if not covered:
                          print(f"::error title=actions-policy::{path}: {ref} is not covered by "
                                f"the organisation allow-list. Every consumer calling a workflow "
                                f"that references it fails at startup, with no jobs and no logs. "
                                f"Add {name}@* to the org policy and to "
                                ".github/actions-allowlist.txt, or avoid the reference.")
                          status = 1
                          continue

                      # Covered is not pinned. Applies to github-owned too: the
                      # repository rule shows `actions/checkout@<sha>` as its own
                      # example, and a floating ref is mutable whoever owns it.
                      if not SHA.fullmatch(rev):
                          print(f"::error title=actions-policy::{path}: {ref} is on a mutable "
                                "ref. Pin it to the full 40-character commit SHA the ref "
                                "resolves to today, with the version in a trailing comment. "
                                "Pinning is not an upgrade.")
                          status = 1

          print("every action reference is covered and pinned" if status == 0 else "", end="")
          sys.exit(status)
          CHECK
