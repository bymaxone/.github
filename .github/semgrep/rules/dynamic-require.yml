rules:
  - id: bymax.js.dynamic-module-load-non-literal
    message: >-
      A module is loaded from a value that is not a literal. Whoever controls the value chooses
      which code is loaded. Select from an explicit map of allowed module names, or import a
      literal specifier.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      cwe: ["CWE-829: Inclusion of Functionality from Untrusted Control Sphere"]
      category: security
    patterns:
      - pattern-either:
          - pattern: require($X)
          - pattern: import($X)
      - pattern-not: require("...")
      - pattern-not: import("...")
