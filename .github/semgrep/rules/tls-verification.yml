rules:
  - id: bymax.js.tls-verification-disabled
    message: >-
      TLS certificate verification is disabled, so any party on the network path can impersonate
      the server. Remove the override and trust the right certificate authority instead
      (for a private CA, set NODE_EXTRA_CA_CERTS or the `ca` option).
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: ["CWE-295: Improper Certificate Validation"]
      category: security
    pattern-either:
      - pattern: "{ ..., rejectUnauthorized: false, ... }"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = 0
      - pattern: process.env["NODE_TLS_REJECT_UNAUTHORIZED"] = "0"
