rules:
  - id: bymax.js.child-process-shell-non-literal
    message: >-
      A shell command is built from a value that is not a literal. Whoever controls the value
      injects shell commands. Use execFile or spawn with an argument array and no `shell: true`.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command"]
      category: security
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $CP.exec($CMD, ...)
                  - pattern: $CP.execSync($CMD, ...)
              - pattern-inside: |
                  $CP = require($MOD);
                  ...
              - metavariable-regex:
                  metavariable: $MOD
                  regex: ^['"]?(node:)?child_process['"]?$
          - patterns:
              - pattern-either:
                  - pattern: $CP.exec($CMD, ...)
                  - pattern: $CP.execSync($CMD, ...)
              - pattern-inside: |
                  import * as $CP from $MOD;
                  ...
              - metavariable-regex:
                  metavariable: $MOD
                  regex: ^['"]?(node:)?child_process['"]?$
          - patterns:
              - pattern-either:
                  - pattern: $CP.exec($CMD, ...)
                  - pattern: $CP.execSync($CMD, ...)
              - pattern-inside: |
                  import $CP from $MOD;
                  ...
              - metavariable-regex:
                  metavariable: $MOD
                  regex: ^['"]?(node:)?child_process['"]?$
          - patterns:
              - pattern-either:
                  - pattern: $CP.default.exec($CMD, ...)
                  - pattern: $CP.default.execSync($CMD, ...)
              - pattern-inside: |
                  import * as $CP from $MOD;
                  ...
              - metavariable-regex:
                  metavariable: $MOD
                  regex: ^['"]?(node:)?child_process['"]?$
          - patterns:
              - pattern-either:
                  - pattern: require($MOD).exec($CMD, ...)
                  - pattern: require($MOD).execSync($CMD, ...)
              - metavariable-regex:
                  metavariable: $MOD
                  regex: ^['"]?(node:)?child_process['"]?$
          - patterns:
              - pattern-either:
                  - pattern: $F($CMD, ...)
              - pattern-inside: |
                  import { ..., $F, ... } from $MOD;
                  ...
              - metavariable-regex:
                  metavariable: $F
                  regex: ^(exec|execSync)$
              - metavariable-regex:
                  metavariable: $MOD
                  regex: ^['"]?(node:)?child_process['"]?$
          - patterns:
              - pattern-either:
                  - pattern: $F($CMD, ...)
              - pattern-inside: |
                  const { ..., $F, ... } = require($MOD);
                  ...
              - metavariable-regex:
                  metavariable: $F
                  regex: ^(exec|execSync)$
              - metavariable-regex:
                  metavariable: $MOD
                  regex: ^['"]?(node:)?child_process['"]?$
          - patterns:
              - pattern-either:
                  - pattern: $CP.exec($CMD, ...)
                  - pattern: $CP.execSync($CMD, ...)
              - pattern-inside: |
                  $CP = await import($MOD);
                  ...
              - metavariable-regex:
                  metavariable: $MOD
                  regex: ^['"]?(node:)?child_process['"]?$
          - patterns:
              - pattern: $F($CMD, ...)
              - pattern-inside: |
                  const { ..., $F, ... } = await import($MOD);
                  ...
              - metavariable-regex:
                  metavariable: $F
                  regex: ^(exec|execSync)$
              - metavariable-regex:
                  metavariable: $MOD
                  regex: ^['"]?(node:)?child_process['"]?$
          - patterns:
              - pattern-either:
                  - pattern: (await import($MOD)).exec($CMD, ...)
                  - pattern: (await import($MOD)).execSync($CMD, ...)
              - metavariable-regex:
                  metavariable: $MOD
                  regex: ^['"]?(node:)?child_process['"]?$
          - pattern: '$CP.spawn($CMD, ..., { ..., shell: true, ... })'
          - pattern: '$CP.spawnSync($CMD, ..., { ..., shell: true, ... })'
          - pattern: 'spawn($CMD, ..., { ..., shell: true, ... })'
          - pattern: 'spawnSync($CMD, ..., { ..., shell: true, ... })'
      - metavariable-pattern:
          metavariable: $CMD
          patterns:
            - pattern-not: '"..."'
