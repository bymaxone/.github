# Copy this to `.github/dependabot.yml` in each repo.
#
# This is how Bymax does "weekly dependency / third-party security" scanning:
# Dependabot runs on GitHub infrastructure (≈ zero Action minutes), opening PRs
# when a new CVE affects a dependency you did not touch. Those PRs then go through
# the normal event-driven CI + dependency-review gate. No scheduled CI job needed.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One PR for all non-major dev/runtime bumps keeps the noise (and CI runs) low.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # `agents-sync.yml` is the one Bymax reusable a caller pins to a commit: it is handed the sync
      # App's private key (see the README). This group moves that SHA in a pull request of its own,
      # to the newest release of the same major. The other Bymax reusables stay on `@v1`, which
      # Dependabot leaves alone.
      bymax-agents-sync:
        patterns:
          - 'bymaxone/.github/.github/workflows/agents-sync.yml'
    ignore:
      # A new major is a deliberate migration, never an automatic bump.
      - dependency-name: 'bymaxone/.github*'
        update-types: ['version-update:semver-major']
